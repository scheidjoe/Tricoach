<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TriCoach">
<title>TriCoach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230c0d0c%22%2F%3E%3Cpath%20d%3D%22M15%2017h34M32%2017v28%22%20stroke%3D%22%233fd35f%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M15%2054h8%22%20stroke%3D%22%233ee0c6%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M28%2054h8%22%20stroke%3D%22%23b48cff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M41%2054h8%22%20stroke%3D%22%235cc8ff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d0c; --panel:#151715; --panel2:#1c1f1c; --line:#2a2e2a;
  --text:#f1f3ee; --mute:#9aa197; --dim:#6b7268;
  --accent:#3fd35f; --accent2:#a5efb4; --ok:#7ee08a; --warn:#ffd166;
  --str:#3fd35f; --run:#5cc8ff; --bike:#b48cff; --swim:#3ee0c6; --hyrox:#ffd166; --mob:#9aa197; --rest:#3a3f39;
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 92px)}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase}
.brand svg{width:30px;height:30px}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.4px;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:22px;margin:22px 0 10px}
h3{font-size:18px}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--accent);color:#04140a;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
label.f{display:block;margin:12px 0 6px;font-size:13px;color:var(--mute);font-weight:600}
input.i,select.i,textarea.i{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent)}
textarea.i{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:#04140a;border-color:var(--accent);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,12,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(var(--safe-b) + 8px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.strip button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.strip button.sel{border-color:var(--accent);background:#0f2216}
.strip .d{font-size:11px;color:var(--mute);font-weight:600}
.strip .n{font:700 18px/1 "Barlow Condensed",sans-serif}
.strip .st{width:16px;height:4px;border-radius:2px}
.hero{border-radius:var(--r);padding:18px;margin-bottom:12px;background:linear-gradient(140deg,#0f1e15 0%,#151715 60%);border:1px solid #1f3d28}
.hero .type{font:700 13px/1 Inter;letter-spacing:1.2px;text-transform:uppercase}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:4px}
.item .nm{font-weight:700}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:3px}
.kv b{color:var(--text);font-weight:600}
.setgrid{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:8px}
.setgrid .h{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase}
.setgrid input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210b}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font:800 30px/1 "Barlow Condensed",sans-serif}
.stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:#04140a;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:12px;color:var(--mute);background:none;padding:2px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 66px);padding:8px 16px;z-index:9}
.composer .in{max-width:528px;margin:0 auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px}
.composer input{flex:1;background:none;border:0;outline:none;padding:8px}
.composer textarea{flex:1;background:none;border:0;outline:none;padding:8px;resize:none;max-height:120px;min-width:0}
.composer.iv{bottom:var(--safe-b)}
.ivbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin:14px 0 16px}
.ivbar div{height:100%;background:var(--accent);transition:width .3s}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.quick button{white-space:nowrap}
/* misc */
.empty{text-align:center;padding:30px 10px}
.empty svg{width:54px;height:54px;color:var(--accent);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 16px calc(var(--safe-b) + 20px)}
.spinner{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}
.btn.ghost .spinner{border-color:rgba(255,255,255,.2);border-top-color:var(--text)}
@keyframes sp{to{transform:rotate(360deg)}}
.phasebar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.phasebar div{height:100%}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.bars .bar.cur{background:var(--accent2)}
.bars .lb{font-size:10px;color:var(--dim)}
.bars .vl{font-size:10px;color:var(--mute)}
.rmrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.rmrow:first-child{border-top:0}
.rmrow .v{font:700 22px/1 "Barlow Condensed",sans-serif}
.del{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px}
.review{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:14px}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.progress div{height:100%;background:var(--ok)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; return addDays(x,-w); };
const today = () => iso(new Date());
const planStart = () => { const n=new Date(); return n.getDay()===0 ? addDays(monday(n),7) : monday(n); };
const DOW = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DOWL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const fmtD = s => { const d=parseD(s); return DOWL[(d.getDay()+6)%7]+", "+d.getDate()+". "+MON[d.getMonth()]; };
const num = v => { const m = String(v ?? "").replace(",",".").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const uid = () => Math.random().toString(36).slice(2,10);
const weeksUntil = s => Math.ceil((parseD(s) - new Date())/(7*864e5));

const TYPES = {
  strength:{l:"Kraft",c:"var(--str)"}, run:{l:"Laufen",c:"var(--run)"}, bike:{l:"Rad",c:"var(--bike)"},
  swim:{l:"Schwimmen",c:"var(--swim)"}, hyrox:{l:"Hyrox",c:"var(--hyrox)"}, hybrid:{l:"Hybrid",c:"var(--hyrox)"},
  mobility:{l:"Mobility",c:"var(--mob)"}, rest:{l:"Ruhetag",c:"var(--rest)"},
  brick:{l:"Koppel Rad+Lauf",c:"var(--bike)"}, triathlon:{l:"Triathlon",c:"var(--swim)"}
};
const T = t => TYPES[t] || TYPES.hybrid;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }

/* ============ state & storage ============ */
const KEYS = ["profile","plan","logs","season","chat","history","imported","conn","interview","proposal"];
const DEF = {
  profile:{ onboarded:false, name:"", goals:"", level:"mittel", sports:["strength","run"], equipment:"Fitnessstudio", limitations:"", lang:"de" },
  plan:null, logs:{}, season:{ events:[] }, chat:[], history:[], imported:[], proposal:null, interview:{ active:false, done:false, skipped:false, msgs:[], summary:"", err:"" }, conn:{ gemKey:"", gemModel:"", icuKey:"", icuId:"0", autoPush:true, lastSync:0 }
};
const S = {}; const LS = "hybridcoach_v1_";
for (const k of KEYS){ let v=null; try{ v = JSON.parse(localStorage.getItem(LS+k)); }catch(e){} S[k] = v ?? structuredClone(DEF[k]); }

let sample=null;
function save(k){ try{ localStorage.setItem(LS+k, JSON.stringify(S[k])); }catch(e){} }
function initCaps(){ sample = S.conn.gemKey ? makeGemini() : null; }

/* ============ Gemini (kostenloser Google-KI-Schlüssel) ============ */
function gemSchema(x){
  if (Array.isArray(x)) return x.map(gemSchema);
  if (x && typeof x==="object"){ const o={}; for (const [k,v] of Object.entries(x)) o[k] = k==="type" && typeof v==="string" ? v.toUpperCase() : gemSchema(v); return o; }
  return x;
}
const sleep = ms => new Promise(res=>setTimeout(res,ms));
const TS = () => window.AI_TS || 1; // nur für Tests
let aiNote = "";
function setAiNote(t){ aiNote = t||""; const el = document.getElementById("aiNote"); if (el) el.textContent = aiNote; }
const cleanKey = k => String(k||"").replace(/[^\x21-\x7E]/g, ""); // entfernt Leerzeichen, Zeilenumbrüche und unsichtbare Zeichen
let gemNote = "";
async function probe(url, ms){ const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms*TS()); try{ await fetch(url, { mode:"no-cors", cache:"no-store", signal:c.signal }); } finally{ clearTimeout(t); } }
async function netMessage(e){
  const tech = " (Technisch: "+(e?.detail||"Failed to fetch")+")";
  if (!/^AIza[\w-]{30,}$/.test(cleanKey(S.conn.gemKey))) return "Der Google-Schlüssel sieht ungewöhnlich aus. Er beginnt mit „AIza“ und hat etwa 39 Zeichen. Bitte in den Verbindungen neu einfügen."+tech;
  if (navigator.onLine===false) return "Dein Gerät ist offline. Bitte die Internetverbindung prüfen."+tech;
  let general = false;
  try{ await probe("https://www.google.com/generate_204", 6000); general = true; }catch(_){}
  return general
    ? "Dein Gerät hat Internet, aber die Google-KI-Schnittstelle (generativelanguage.googleapis.com) ist nicht erreichbar. Häufige Ursachen: Werbe- oder Tracking-Blocker im Browser, VPN, DNS-Filter oder ein gesperrtes Netzwerk (Dienst- oder Firmen-WLAN). Probier mobile Daten statt WLAN oder einen anderen Browser."+tech
    : "Keine Internetverbindung. Bitte Verbindung prüfen und nochmal versuchen."+tech;
}
async function fetchJSON(url, init, ms){
  const ctl = new AbortController(); let timedOut = false;
  const t = setTimeout(()=>{ timedOut = true; ctl.abort(); }, ms*TS());
  try{
    const r = await fetch(url, { ...init, signal: ctl.signal });
    let j = null; try{ j = await r.json(); }catch(e){ if (timedOut) throw e; }
    return { ok:r.ok, status:r.status, json:j };
  }catch(e){ throw Object.assign(new Error(timedOut?"timeout":"network"), { timeout: timedOut, detail: String(e?.message||e) }); }
  finally{ clearTimeout(t); }
}
async function pickModel(){
  let r; try{ r = await fetchJSON("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers:{ "x-goog-api-key": cleanKey(S.conn.gemKey) } }, 15000); }
  catch(e){ throw Object.assign(new Error(e.timeout?"Google antwortet nicht (Zeitüberschreitung bei der Modellsuche). Bitte nochmal versuchen.":await netMessage(e)),{code:e.timeout?"timeout":"network"}); }
  if (!r.ok){ const msg = r.json?.error?.message||""; throw Object.assign(new Error("Google-KI-Schlüssel ungültig oder gesperrt. "+msg),{code:"bad_key"}); }
  const j = r.json||{};
  const ver = n => { const m = n.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const names = (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
  const flash = names.filter(n=>/flash/.test(n) && !/image|tts|audio|live|embed|vision|robot|computer/.test(n));
  // Stabile Modelle zuerst (Preview/Exp sind oft überlastet), dann neueste Version, Lite zuletzt
  const score = n => ver(n)*100 - (/lite/.test(n)?30:0) - (/preview|exp/.test(n)?150:0) - (/\d{2}-\d{2}|\d{3}$/.test(n)?1:0);
  const list = (flash.length?flash:names.filter(n=>/gemini/.test(n))).sort((a,b)=>score(b)-score(a));
  if (!list.length) throw Object.assign(new Error("Kein passendes Google-KI-Modell für diesen Schlüssel gefunden"),{code:"no_model"});
  S.conn.models = list; S.conn.autoModel = list[0]; save("conn"); return list[0];
}
async function gemCall(contents, opts={}, retried){
  const {tools, json} = opts;
  const perTry = opts.timeoutMs || 60000, deadline = (opts.deadlineMs || 150000) * TS();
  const t0 = Date.now();
  const body = { contents, generationConfig:{ temperature:0.7 } };
  if (json) body.generationConfig.responseMimeType = "application/json";
  if (tools?.length) body.tools = [{ functionDeclarations: tools.map(t=>({ name:t.name, description:t.description, parameters: gemSchema(t.inputSchema) })) }];
  if (!S.conn.autoModel && !S.conn.gemModel) await pickModel();
  // Gewähltes Modell zuerst, danach höchstens 2 Ausweichmodelle
  const first = S.conn.gemModel || S.conn.autoModel;
  const candidates = [first, ...(S.conn.models||[]).filter(m=>m!==first)].filter(Boolean).slice(0,3);
  let lastErr, sawGone = false;
  outer: for (const model of candidates){
    for (let attempt=0; attempt<2; attempt++){
      if (Date.now()-t0 > deadline) break outer;
      // Bei schnellen Antworten (Gespräch) das Nachdenken abschalten, wo das Modell es erlaubt
      const reqBody = (opts.fast && /gemini-2\.5-flash/.test(model)) ? { ...body, generationConfig:{ ...body.generationConfig, thinkingConfig:{ thinkingBudget:0 } } } : body;
      let r;
      try{
        r = await fetchJSON(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
          { method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key": cleanKey(S.conn.gemKey) }, body: JSON.stringify(reqBody) }, perTry);
      }catch(e){
        if (e.timeout){ lastErr = Object.assign(new Error("keine Antwort von "+model+" innerhalb von "+Math.round(perTry/1000)+" s"),{code:"timeout"}); setAiNote("Google antwortet langsam – ich probiere ein anderes Modell …"); break; }
        throw Object.assign(new Error(await netMessage(e)),{code:"network"});
      }
      if (r.ok){
        const c = r.json?.candidates?.[0];
        if (!c?.content?.parts) throw Object.assign(new Error("Leere Antwort der KI"+(c?.finishReason?" ("+c.finishReason+")":"")),{code:"empty"});
        if (model!==first && !S.conn.gemModel){ S.conn.autoModel = model; save("conn"); }
        setAiNote("");
        return c.content;
      }
      const msg = r.json?.error?.message||"";
      if (r.status===429) throw Object.assign(new Error("Gratis-Kontingent der Google-KI gerade aufgebraucht – kurz warten oder morgen wieder."),{code:"rate_limited"});
      if (r.status===400||r.status===401||r.status===403) throw Object.assign(new Error("Google-KI-Schlüssel ungültig oder gesperrt. "+msg),{code:"bad_key"});
      if (r.status===404 || /no longer available|not found|is not supported/i.test(msg)){
        sawGone = true; lastErr = Object.assign(new Error("Modell "+model+" nicht verfügbar"),{code:"upstream"}); break;
      }
      lastErr = Object.assign(new Error("Google meldet Fehler "+r.status+(msg?": "+msg:"")),{code:"upstream"});
      if ([500,502,503,504].includes(r.status) && attempt<1){ setAiNote("Google ist gerade überlastet – neuer Versuch …"); await sleep(1500*TS()); continue; }
      setAiNote("Modell überlastet – ich probiere ein anderes …"); break;
    }
  }
  if (!retried && sawGone){ // Modellliste veraltet: neu laden und einmal erneut versuchen
    S.conn.autoModel=""; S.conn.models=[]; S.conn.gemModel=""; save("conn"); await pickModel(); return gemCall(contents, opts, true);
  }
  setAiNote("");
  const slow = lastErr?.code==="timeout" || Date.now()-t0 > deadline;
  throw Object.assign(new Error((slow
    ? "Der Coach hat zu lange gebraucht, Google antwortet gerade langsam. "
    : "Die Google-KI ist gerade überlastet. ")

function makeGemini(){
  const toContents = input => typeof input==="string" ? [{role:"user",parts:[{text:input}]}] : input.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const fn = async (input, opts={}) => {
    const contents = toContents(input);
    for (let round=0; round<6; round++){
      const content = await gemCall(contents, { tools: opts.tools, json: opts.json, fast: opts.fast, timeoutMs: opts.timeoutMs, deadlineMs: opts.deadlineMs });
      const calls = content.parts.filter(p=>p.functionCall);
      if (calls.length && opts.tools){
        contents.push({role:"model", parts: content.parts});
        const resp = [];
        for (const c of calls){
          const t = opts.tools.find(t=>t.name===c.functionCall.name);
          let out; try{ out = { result: await t.execute(c.functionCall.args||{}) }; }catch(e){ out = { error: String(e.message||e) }; }
          resp.push({ functionResponse:{ name:c.functionCall.name, response: out } });
        }
        contents.push({role:"user", parts: resp});
        continue;
      }
      const text = content.parts.filter(p=>p.text && !p.thought).map(p=>p.text).join("").trim();
      opts.onText?.({text, delta:text});
      return { text };
    }
    return { text:"Ich habe den Plan angepasst." };
  };
  fn.json = async (input, opts={}) => { const r = await fn(input, {...opts, json:true}); const t=r.text; return JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1)); };
  return fn;
}

function weekSummaries(t){
  const planned = allPlannedDays(), out = [], m0 = monday(new Date());

  for (let w=3; w>=0; w--){
    const sd = iso(addDays(m0,-7*w)), ed = iso(addDays(m0,-7*w+6));
    let done=0, plan=0, min=0; const km = {};
    for (const [d,p] of Object.entries(planned)) if (d>=sd && d<=ed && p.type!=="rest" && (d<t || S.logs[d]?.done)) plan++;
    for (const l of Object.values(S.logs)){
      if (!l.done || l.date<sd || l.date>ed) continue;
      done++; min += +l.duration||0;
      if ((l.activities||[]).length) for (const a of l.activities) km[a.kind] = (km[a.kind]||0) + (a.km||0);

/* ============ analytics ============ */
function oneRMs(){
  const best={};
  for (const l of Object.values(S.logs)){ if(!l.done) continue;
    for (const it of l.items||[]){ if(it.kind!=="strength") continue;
      for (const s of it.sets||[]){ const kg=num(s.kg), r=num(s.reps); if(!kg||!r||r>12||!s.done) continue;
        const rm = Math.round(kg*(1+r/30)); const k=it.name.trim();
        if(!best[k]||rm>best[k].rm) best[k]={name:k,rm,kg,reps:r,date:l.date};
      }}}
  return Object.values(best).sort((a,b)=>b.rm-a.rm);
}
function rmHistory(name){
  const pts=[];
  for (const l of Object.values(S.logs)){ if(!l.done) continue;
    for (const it of l.items||[]) if(it.name.trim()===name) { let m=0; for(const s of it.sets||[]){const kg=num(s.kg),r=num(s.reps); if(kg&&r&&r<=12&&s.done) m=Math.max(m,kg*(1+r/30));} if(m) pts.push({date:l.date,rm:Math.round(m)}); } }
  return pts.sort((a,b)=>a.date.localeCompare(b.date));
}
function allPlannedDays(){
  const m = {};
  for (const w of S.history) for (const d of w.days) m[d.date]=d;
  if (S.plan) for (const d of S.plan.days) m[d.date]=d;
  return m;
}
function consistency(days){
  const all = allPlannedDays(); const t=today(); const from=iso(addDays(new Date(),-days));
  let planned=0, done=0;
  for (const d of Object.values(all)) if (d.type!=="rest" && d.date>=from && d.date<=t){ planned++; if (S.logs[d.date]?.done) done++; }
  return planned ? Math.round(done/planned*100) : 0;
}
function weekStats(n){
  const out=[]; const m0 = monday(new Date());
  for (let i=n-1;i>=0;i--){
    const s=addDays(m0,-7*i), e=addDays(s,6); let ton=0, mins=0, cnt=0;

  const s = sessions[0];
  const start = (s[2]||s[253]||0) + FIT_EPOCH;
  let kind = sportMap[s[5]] || "other"; if (s[5]===10 && s[6]!==20 && !sets.length) kind="hybrid";

    durationSec: (s[8]??s[7]??0)/1000, distanceM: (s[9]??0)/100, avgHr: s[16]||null, maxHr: s[17]||null, kcal: s[11]||null,
    sets: sets.filter(x=>x[5]===1 || (x[5]==null && x[3])).map(x=>({ cat: FIT_CATS[x[7]] || null, reps: x[3]??null, kg: x[4]!=null ? Math.round(x[4]/16*10)/10 : null })) };

function haversine(a,b){ const R=6371000, r=Math.PI/180; const dLa=(b[0]-a[0])*r, dLo=(b[1]-a[1])*r; const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

function parseGPX(txt){
  const x = new DOMParser().parseFromString(txt,"application/xml");

  for (const p of pts){ const c=[+p.getAttribute("lat"),+p.getAttribute("lon")]; if(prev) dist+=haversine(prev,c); prev=c;

function parseTCX(txt){

}
async function unzip(buf){
  const dv=new DataView(buf); let e=buf.byteLength-22;
  while (e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if (e<0) throw new Error("ZIP defekt");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out=[];
  for (let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl)); p+=46+nl+xl+cl;
    if (name.endsWith("/")) continue;
    const ds=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    const raw=buf.slice(ds,ds+csize);
    let data;
    if (method===0) data=raw;
    else if (method===8){
      if (window.DecompressionStream) data = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
      else if (window.JSZip){ const z=await JSZip.loadAsync(buf); data=await z.file(name).async("arraybuffer"); }
      else throw new Error("ZIP wird von diesem Browser nicht unterstützt – bitte die .fit direkt wählen");
    } else continue;
    out.push({name,data});
  }
  return out;
}
async function parseActivityFile(name, data){
  const n = name.toLowerCase();
  if (n.endsWith(".zip")){
    const out=[];
    for (const f of await unzip(data)){ if (!/\.(fit|gpx|tcx)$/i.test(f.name)) continue;
      out.push(...await parseActivityFile(f.name, f.data)); }
    if (!out.length) throw new Error("Keine FIT/GPX/TCX im ZIP");
    return out;
  }
  if (n.endsWith(".fit")) return [parseFIT(data)];
  const txt = new TextDecoder().decode(data);
  if (n.endsWith(".gpx")) return [parseGPX(txt)];
  if (n.endsWith(".tcx")) return [parseTCX(txt)];

}
const KIND_L = {run:"Laufen",bike:"Radfahren",swim:"Schwimmen",strength:"Krafttraining",walk:"Gehen/Wandern",row:"Rudern",hybrid:"Training",other:"Aktivität"};
const KIND_T = {run:"run",bike:"bike",swim:"swim",strength:"strength",walk:"mobility",row:"hybrid",hybrid:"hybrid",other:"hybrid"};
const fmtDur = s => { s=Math.round(s); const h=s/3600|0, m=(s%3600)/60|0, ss=s%60; return h?`${h}:${pad(m)}:${pad(ss)}`:`${m}:${pad(ss)}`; };
const fmtPace = a => { if(!a.distanceM||!a.durationSec) return ""; if(a.kind==="bike") return (a.distanceM/1000/(a.durationSec/3600)).toFixed(1)+" km/h"; if(a.kind==="swim") return fmtDur(a.durationSec/(a.distanceM/100))+" /100 m"; return fmtDur(a.durationSec/(a.distanceM/1000))+" /km"; };

function applyActivity(a){
  S.imported = S.imported || [];
  if (S.imported.includes(a.id) || Object.values(S.logs).some(l=>(l.activities||[]).some(x=>x.id===a.id || Math.abs(x.start-a.start)<120000))) { S.imported.push(a.id); return {status:"dup"}; }
  const date = iso(new Date(a.start));
  const day = dayById(date);
  let log = S.logs[date];
  if (!log){
    log = day && day.type!=="rest" ? newLog(day) : { date, title:KIND_L[a.kind], type:KIND_T[a.kind], done:false, rpe:null, note:"", duration:"", items:[] };
    S.logs[date] = log;
  }
  const km = Math.round(a.distanceM/10)/100, min = Math.round(a.durationSec/60);
  if (a.kind!=="strength" && a.distanceM>0){
    let it = log.items.find(i=>i.kind==="cardio" && !num(i.distance));
    if (!it){ it={name:KIND_L[a.kind],kind:"cardio",distance:"",time:"",done:false}; log.items.push(it); }
    it.distance = km; it.time = min; it.done = true;
  }
  if (a.sets?.length){
    const used = new Set();
    const groups = {};
    a.sets.forEach(s=>{ const k=s.cat||"other"; (groups[k]=groups[k]||[]).push(s); });
    for (const [cat, ss] of Object.entries(groups)){
      const re = CAT_MATCH[cat];
      let it = re ? log.items.find((i,ix)=>i.kind==="strength" && !used.has(ix) && re.test(i.name)) : null;
      if (!it){ it = {name: CAT_DE[cat] || "Übung", kind:"strength", sets:[]}; log.items.push(it); }
      used.add(log.items.indexOf(it));
      it.sets = ss.map(s=>({reps: s.reps ?? "", kg: s.kg ?? "", done:true}));
    }
  }
  if (log.items.length && log.items.every(i=>i.kind==="strength") && !a.sets?.length && a.kind==="strength"){
    // strength workout without set data: mark planned sets as done
    log.items.forEach(i=>i.sets.forEach(s=>s.done=true));
  }
  log.activities = [...(log.activities||[]), {id:a.id, kind:a.kind, start:a.start, km, durationSec:Math.round(a.durationSec), avgHr:a.avgHr, maxHr:a.maxHr, kcal:a.kcal, pace:fmtPace(a), sets:a.sets?.length||0}];

  log.review = null;
  S.imported.push(a.id); S.imported = S.imported.slice(-500);
  return {status:"ok", date, matched: !!(day && day.type!=="rest"), title: log.title};
}
async function importFiles(files){
  let ok=0, dup=0, err=[], last=null;
  for (const f of files){
    try{
      const acts = await parseActivityFile(f.name, await f.arrayBuffer());
      for (const a of acts){ const r = applyActivity(a); if (r.status==="ok"){ ok++; last=r; } else dup++; }
    }catch(e){ console.error(e); err.push(f.name+": "+e.message); }
  }
  save("logs"); save("imported");
  sheet=null;
  if (last){ selDate = last.date; tab = S.plan?.days.some(d=>d.date===last.date) ? "heute" : "fortschritt"; }
  render();
  if (last) coachCheck(last.date);
  toast(ok ? `${ok} Garmin-Aktivität${ok>1?"en":""} importiert${dup?`, ${dup} schon vorhanden`:""} ✔` : err.length ? "Import fehlgeschlagen: "+err[0] : "Schon importiert");

/* ============ intervals.icu (Live-Garmin) ============ */
const ICU = "https://intervals.icu/api/v1";
const icuOn = () => !!S.conn.icuKey;
async function icu(path, opts={}){
  let r;
  try{
    r = await fetch(ICU+path.replace("{id}", encodeURIComponent(S.conn.icuId||"0")), { ...opts, headers:{ "Authorization":"Basic "+btoa("API_KEY:"+S.conn.icuKey.trim()), ...(opts.body?{"Content-Type":"application/json"}:{}), ...(opts.headers||{}) } });
  }catch(e){ throw new Error("intervals.icu nicht erreichbar (Internet?)"); }
  if (r.status===401||r.status===403) throw new Error("intervals.icu: API-Schlüssel oder Athleten-ID falsch");
  if (!r.ok) throw new Error("intervals.icu Fehler "+r.status);
  if (opts.raw) return r;
  const t = await r.text(); try{ return t ? JSON.parse(t) : null; }catch(e){ return null; }
}
const ICU_KIND = t => { t=t||""; if(/Run/.test(t)) return "run"; if(/Ride|Cycl/.test(t)) return "bike"; if(/Swim/.test(t)) return "swim"; if(/Weight|Strength/.test(t)) return "strength"; if(/Walk|Hike/.test(t)) return "walk"; if(/Row/.test(t)) return "row"; return "hybrid"; };
const ICU_TYPE = {brick:"Ride",strength:"WeightTraining",run:"Run",bike:"Ride",swim:"Swim",hyrox:"Workout",hybrid:"Workout",mobility:"Yoga"};
async function gunzipMaybe(buf){
  const u = new Uint8Array(buf, 0, 2);
  if (u[0]===0x1f && u[1]===0x8b && window.DecompressionStream) return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return buf;
}
let syncing=false;
async function syncGarmin(manual){
  if (!icuOn() || syncing) return;
  syncing=true; busy.sync=true; if(manual) render();
  let added=[];
  try{
    const oldest = iso(addDays(new Date(), manual? -42 : -21));
    const acts = await icu(`/athlete/{id}/activities?oldest=${oldest}&newest=${today()}`);
    let stravaOnly = 0;
    for (const a of (acts||[]).sort((x,y)=>String(x.start_date_local).localeCompare(String(y.start_date_local)))){
      if (!a.start_date_local || (!a.moving_time && !a.elapsed_time)){ if (a.source==="STRAVA") stravaOnly++; continue; }
      const id = "icu-"+a.id;
      if ((S.imported||[]).includes(id)) continue;
      const act = { id, start: Date.parse(a.start_date_local), kind: ICU_KIND(a.type), durationSec: a.moving_time||a.elapsed_time||0, distanceM: a.distance||0,
        avgHr: a.average_heartrate?Math.round(a.average_heartrate):null, maxHr: a.max_heartrate?Math.round(a.max_heartrate):null, kcal: a.calories||null, sets: [] };
      if (act.kind==="strength"){
        try{ const r = await icu(`/activity/${encodeURIComponent(a.id)}/file`, {raw:true}); const fit = parseFIT(await gunzipMaybe(await r.arrayBuffer())); act.sets = fit.sets||[]; }catch(e){ console.warn("FIT", e); }
      }
      const res = applyActivity(act);
      if (res.status==="ok") added.push({res, act});
    }
    S.conn.lastSync = Date.now(); S.conn.lastError = ""; save("conn");
    if (added.length){ save("logs"); save("imported");
      const l = added[added.length-1];
      toast(added.length===1 ? `Garmin: ${KIND_L[l.act.kind]}${l.act.distanceM?" "+(Math.round(l.act.distanceM/100)/10)+" km":""} übernommen ✔` : `${added.length} neue Garmin-Aktivitäten übernommen ✔`);
    } else if (manual) toast(stravaOnly ? "Achtung: Aktivitäten kommen über Strava – bitte Garmin direkt mit intervals.icu verbinden" : "Alles aktuell ✔");
  }catch(e){ S.conn.lastError = e.message; save("conn"); if (manual) toast(e.message); }
  syncing=false; busy.sync=false; render();
  if (added.length) coachCheck(added[added.length-1].res.date);
}
function garminDesc(d){
  const lines=[];
  if (d.garmin && ["run","bike","swim","brick"].includes(d.type)) lines.push(d.garmin.trim(), "");
  else if (["run","bike","swim"].includes(d.type) && d.durationMin) lines.push(`- ${d.durationMin}m ${d.intensity==="hart"?"Z3":"Z2"} HR`, "");
  if (d.notes) lines.push(d.notes);
  for (const it of d.items){
    if (it.kind==="strength") lines.push(`${it.name}: ${it.sets}×${it.reps}${it.load?" @ "+it.load:""}${it.notes?" ("+it.notes+")":""}`);
    else if (!d.garmin) lines.push(`${it.name}${it.target?": "+it.target:""}`);
  }
  lines.push("", "Geplant mit TriCoach");
  return lines.join("\n");
}
async function pushPlan(plan, manual){
  if (!icuOn() || !plan) return;
  busy.push=true; if(manual) render();
  try{
    const events = plan.days.filter(d=>d.type!=="rest").map(d=>({ category:"WORKOUT", start_date_local:d.date+"T00:00:00", type: ICU_TYPE[d.type]||"Workout",
      name: d.title, description: garminDesc(d), moving_time: d.durationMin? d.durationMin*60 : undefined, external_id:"hybridcoach-"+d.date }));
    if (events.length) await icu(`/athlete/{id}/events/bulk?upsert=true`, { method:"POST", body: JSON.stringify(events) });
    // remove old TriCoach workouts on days that are now rest days
    const end = iso(addDays(parseD(plan.start),6));
    const existing = await icu(`/athlete/{id}/events?oldest=${plan.start}&newest=${end}&category=WORKOUT`);
    const restDates = new Set(plan.days.filter(d=>d.type==="rest").map(d=>d.date));
    for (const ev of existing||[]) if (String(ev.external_id||"").startsWith("hybridcoach-") && restDates.has(String(ev.start_date_local).slice(0,10)))
      await icu(`/athlete/{id}/events/${ev.id}`, { method:"DELETE" });
    plan.pushedAt = Date.now(); save(plan===S.plan?"plan":"nextPlan");
    if (manual) toast("Plan an Garmin gesendet ✔ – Uhr synchronisieren");
  }catch(e){ S.conn.lastError = e.message; save("conn"); toast("Senden an Garmin fehlgeschlagen: "+e.message); }
  busy.push=false; render();
}
const autoPush = plan => { if (icuOn() && S.conn.autoPush) pushPlan(plan); };

/* today */
function viewToday(){
  if (!S.plan) return noPlan();

  const strip = `<div class="strip">${S.plan.days.map((x,i)=>{ const dd=parseD(x.date); const done=S.logs[x.date]?.done;
    return `<button class="${x.date===d.date?"sel":""}" data-sel="${x.date}"><span class="d">${DOW[i]}</span><span class="n" style="${x.date===today()?"color:var(--accent)":""}">${dd.getDate()}</span><span class="st" style="background:${done?"var(--ok)":T(x.type).c};opacity:${x.type==="rest"?.4:1}"></span></button>`; }).join("")}</div>`;
  return proposalCard() + `<div class="row between" style="margin-bottom:12px"><div><div class="mute small">${S.plan.phase?esc(S.plan.phase)+" · ":""}${esc(S.plan.focus)}</div><h1>${d.date===today()?"Heute":esc(fmtD(d.date).split(",")[0])}</h1></div></div>` + strip + workoutView(d);
}
function noPlan(){
  return `<div class="card empty">${ICON.woche.replace("<svg","<svg")}<h2 style="margin-top:6px">Noch kein Plan für diese Woche</h2><p class="mute">Der Coach plant deine Woche anhand deiner Ziele, Wettkämpfe und letzten Trainings.</p>

}
function workoutView(d){
  const log = S.logs[d.date];
  const t = T(d.type);
  if (d.type==="rest") return `<div class="hero"><div class="type" style="color:${t.c === "var(--rest)" ? "var(--mute)" : t.c}">Ruhetag</div><h2 style="margin:8px 0 4px">${esc(d.title)}</h2><p class="mute" style="margin:0">${esc(d.notes||"Erholung ist Training. Schlaf, Essen, locker bewegen.")}</p></div>
    <button class="btn ghost block" data-act="askSwap" data-date="${d.date}">Doch trainieren? Coach fragen</button>`;
  let h = `<div class="hero">
    <div class="row between"><span class="type" style="color:${t.c}">${t.l}</span>${log?.done?`<span class="tag" style="color:var(--ok);border-color:#2f5a35">${ICON.check} Erledigt</span>`:""}</div>
    <h2 style="margin:8px 0 6px;font-size:28px">${esc(d.title)}</h2>
    <div class="kv">${d.durationMin?`<span><b>${d.durationMin}</b> min</span>`:""}${d.intensity?`<span>Intensität <b>${esc(d.intensity)}</b></span>`:""}<span><b>${d.items.length}</b> Übungen</span></div>
    ${d.notes?`<p class="mute small" style="margin:10px 0 0">${esc(d.notes)}</p>`:""}
  </div>`;
  if (log && !log.done || (log && log.editing)) return h + logView(d, log);
  h += `<div class="card">${d.items.map(it=>`<div class="item"><div class="nm">${esc(it.name)}</div><div class="kv">
      ${it.kind==="strength"?`<span><b>${it.sets}</b> × <b>${esc(it.reps)}</b></span>${it.load?`<span><b>${esc(it.load)}</b></span>`:""}`:""}
      ${it.target?`<span><b>${esc(it.target)}</b></span>`:""}${it.kind==="cardio"&&it.reps?`<span><b>${esc(it.reps)}</b></span>`:""}</div>
      ${it.notes?`<div class="dim small" style="margin-top:3px">${esc(it.notes)}</div>`:""}</div>`).join("") || '<div class="mute">Keine Details.</div>'}</div>`;
  if (log?.done){
    h += `<div class="card"><div class="row between"><h3>Dein Ergebnis</h3><button class="btn ghost sm" data-act="editLog" data-date="${d.date}">Bearbeiten</button></div>
      <div class="kv" style="margin-top:6px"><span>RPE <b>${log.rpe||"–"}</b></span>${log.duration?`<span><b>${log.duration}</b> min</span>`:""}<span>Ausführung <b>${execScore(d,log)}%</b></span></div>
      ${(log.activities||[]).map(actRow).join("")}
      ${log.note?`<p class="mute small">${esc(log.note)}</p>`:""}
      ${log.review?`<div class="review" style="margin-top:10px">${esc(log.review)}</div>`:`<button class="btn ghost block" style="margin-top:12px" data-act="review" data-date="${d.date}" ${busy.review?"disabled":""}>${busy.review?'<span class="spinner"></span> Coach analysiert …':ICON.spark+" Coach-Feedback holen"}</button>`}</div>`;
  } else {
    h += `<button class="btn block" data-act="startLog" data-date="${d.date}">Training starten</button>
      ${icuOn()?`<button class="btn ghost block" style="margin-top:8px" data-act="syncNow" ${busy.sync?"disabled":""}>${busy.sync?'<span class="spinner"></span>':ICON.watch} Garmin wird automatisch übernommen · ${ago(S.conn.lastSync)}</button>`
        :`<button class="btn ghost block" style="margin-top:8px" data-act="garmin">${ICON.watch} Garmin-Uhr verbinden</button>`}
      ${icuOn()&&S.plan?.pushedAt?`<p class="dim small" style="text-align:center;margin:6px 0 0">Dieses Workout ist auf deiner Uhr unter „Trainingskalender“.</p>`:""}
      <div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost grow sm" data-act="quickAdjust" data-date="${d.date}" data-q="Ich habe heute nur 30 Minuten.">Nur 30 min</button><button class="btn ghost grow sm" data-act="quickAdjust" data-date="${d.date}" data-q="Ich fühle mich heute müde, bitte leichter machen.">Bin müde</button><button class="btn ghost grow sm" data-act="quickAdjust" data-date="${d.date}" data-q="Ich habe heute kein Fitnessstudio zur Verfügung.">Kein Gym</button></div>`;
  }
  return h;
}
function execScore(d,log){
  let planned=0, done=0;
  d.items.forEach((it,i)=>{ const li=log.items?.[i]; if(!li) return;
    if (it.kind==="strength"){ planned+=it.sets; done+=(li.sets||[]).filter(s=>s.done).length; }
    else { planned+=1; if(li.done||num(li.distance)||num(li.time)) done+=1; } });
  return planned?Math.min(100,Math.round(done/planned*100)):100;
}
function logView(d, log){
  return `<div class="card">${log.items.map((it,i)=>{
    if (it.kind==="strength") return `<div class="item"><div class="row between"><div class="nm">${esc(it.name)}</div><span class="dim small">Plan: ${d.items[i]?.sets}×${esc(d.items[i]?.reps)} ${esc(d.items[i]?.load)}</span></div>
      <div class="setgrid"><span class="h">Satz</span><span class="h">Wdh.</span><span class="h">kg</span><span></span>
      ${it.sets.map((s,j)=>`<span class="dim" style="text-align:center">${j+1}</span><input inputmode="decimal" value="${esc(s.reps)}" data-lg="${i}.${j}.reps"><input inputmode="decimal" value="${esc(s.kg)}" data-lg="${i}.${j}.kg"><button class="chk ${s.done?"on":""}" data-setdone="${i}.${j}">${ICON.check}</button>`).join("")}
      </div><div class="row" style="gap:6px;margin-top:6px"><button class="btn ghost sm" data-addset="${i}">+ Satz</button>${it.sets.length>1?`<button class="btn ghost sm" data-rmset="${i}">− Satz</button>`:""}</div></div>`;
    return `<div class="item"><div class="row between"><div class="nm">${esc(it.name)}</div><button class="chk ${it.done?"on":""}" data-cdone="${i}">${ICON.check}</button></div>
      ${d.items[i]?.target?`<div class="dim small">Ziel: ${esc(d.items[i].target)}</div>`:""}
      <div class="grid2" style="margin:8px 0 0"><div><label class="f" style="margin-top:0">Distanz (km)</label><input class="i" inputmode="decimal" value="${esc(it.distance)}" data-lc="${i}.distance"></div><div><label class="f" style="margin-top:0">Zeit (min)</label><input class="i" inputmode="decimal" value="${esc(it.time)}" data-lc="${i}.time"></div></div></div>`;
  }).join("")}
  <div class="item"><button class="btn ghost sm" data-act="addExercise" data-date="${d.date}">+ Übung hinzufügen</button></div></div>
  <div class="card"><h3>Abschluss</h3>
    <label class="f">Wie hart war's? (RPE 1–10)</label>
    <div class="chips">${[5,6,7,8,9,10].map(n=>`<button class="chip ${+log.rpe===n?"on":""}" data-rpe="${n}">${n}</button>`).join("")}</div>
    <label class="f">Dauer gesamt (min)</label><input class="i" inputmode="numeric" value="${esc(log.duration||d.durationMin||"")}" data-lf="duration">
    <label class="f">Notiz für den Coach</label><textarea class="i" data-lf="note" placeholder="Wie lief's? Schmerzen? Zu leicht?">${esc(log.note)}</textarea>
  </div>
  <button class="btn block" data-act="finishLog" data-date="${d.date}">${ICON.check} Training abschließen</button>
  <button class="btn ghost block" style="margin-top:8px" data-act="cancelLog" data-date="${d.date}">Abbrechen</button>`;
}

  const rms = oneRMs(); const ws = weekStats(8);
  const done = Object.values(S.logs).filter(l=>l.done).length;
  const maxT = Math.max(1,...ws.map(w=>w.ton)); const maxM = Math.max(1,...ws.map(w=>w.mins));
  const hist = Object.values(S.logs).filter(l=>l.done).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  return `<h1 style="margin-bottom:14px">Fortschritt</h1>
  <div class="grid3"><div class="stat"><div class="v">${done}</div><div class="l">Einheiten</div></div><div class="stat"><div class="v">${consistency(28)}<span style="font-size:18px">%</span></div><div class="l">Konstanz 4 Wo.</div></div><div class="stat"><div class="v">${totalKm()}</div><div class="l">km Ausdauer</div></div></div>
  <div class="card"><div class="row between"><h3>Trainingsvolumen Kraft</h3><span class="dim small">kg × Wdh. / Woche</span></div>
    <div class="bars">${ws.map(w=>`<div class="b"><span class="vl">${w.ton?(w.ton>=1000?(w.ton/1000).toFixed(1)+"t":w.ton):""}</span><div class="bar ${w.cur?"cur":""}" style="height:${w.ton/maxT*85}%"></div><span class="lb">${w.label}</span></div>`).join("")}</div></div>
  <div class="card"><div class="row between"><h3>Trainingszeit</h3><span class="dim small">Minuten / Woche</span></div>

/* season */

  const ev = [...S.season.events].sort((a,b)=>a.date.localeCompare(b.date));

    phaseCard = `<div class="hero"><div class="type" style="color:var(--accent)">Hauptziel</div><h2 style="margin:6px 0 2px;font-size:28px">${esc(main.name)}</h2>
      <div class="mute">${esc(fmtD(main.date))} · ${esc(main.type)}</div>
      <div class="row" style="margin-top:14px;gap:18px"><div><div style="font:800 40px/1 'Barlow Condensed'">${w}</div><div class="dim small">Wochen</div></div><div><div style="font:800 26px/1.2 'Barlow Condensed';color:${ph.c}">${ph.name}</div><div class="dim small">aktuelle Phase</div></div></div>

  ${phaseCard || `<div class="card empty">${ICON.saison}<h2 style="margin-top:4px">Noch kein Ziel</h2><p class="mute">Trag deinen nächsten Triathlon oder Lauf ein. Der Coach richtet die Phasen und Wochenpläne darauf aus.</p><button class="btn" data-act="addEvent">Wettkampf hinzufügen</button></div>`}
  ${up.length?`<h2>Kommende Wettkämpfe</h2>`+up.map(e=>eventRow(e)).join(""):""}
  ${past.length?`<h2>Vergangen</h2>`+past.reverse().map(e=>eventRow(e,true)).join(""):""}
  ${main?`<button class="btn ghost block" style="margin-top:10px" data-act="seasonPlan" ${busy.season?"disabled":""}>${busy.season?'<span class="spinner"></span> Coach plant …':ICON.spark+" Saisonplan vom Coach erklären lassen"}</button>`:""}
  ${S.season.overview?`<div class="card" style="margin-top:12px"><h3>Saisonplan</h3><div class="review" style="margin-top:8px">${esc(S.season.overview)}</div></div>`:""}`;
}
function eventRow(e,past){

function dayById(date){ return S.plan?.days.find(d=>d.date===date) || allPlannedDays()[date]; }
function newLog(d){
  return { date:d.date, title:d.title, type:d.type, done:false, rpe:null, note:"", duration:d.durationMin||"",
    items: d.items.map(it=> it.kind==="strength"
      ? { name:it.name, kind:"strength", sets: Array.from({length:Math.max(1,+it.sets||3)},()=>({reps: num(it.reps)??"", kg: num(it.load)!==null && /kg/i.test(it.load) ? num(it.load) : "", done:false})) }
      : { name:it.name, kind:"cardio", distance:"", time:"", done:false }) };
}

async function doGenerate(start, extra, target){
  busy.gen = true; render();
  try{
    let plan;
    if (sample){ plan = await generateWeek(start, extra); }
    else { plan = templateWeek(start); toast("Ohne KI-Schlüssel – Standardplan erstellt"); }
    if (target==="next"){ S.nextPlan = plan; save("nextPlan"); toast("Nächste Woche ist geplant"); autoPush(plan); }
    else { S.plan = plan; save("plan"); S.proposal = null; save("proposal"); autoPush(plan); selDate = S.plan.days.some(d=>d.date===today()) ? today() : S.plan.days[0].date; toast("Neue Woche steht 💪"); }
  }catch(e){
    console.error(e);
    if (e?.code==="not_granted"){ sample=null; }
    if (!S.plan && target!=="next"){ S.plan = templateWeek(start); save("plan"); autoPush(S.plan); toast("Standardplan erstellt – "+(e?.message||"KI-Fehler")); }
    else toast("Planung fehlgeschlagen: "+(e?.message||"Fehler"));
  }
  busy.gen=false; render();
}

const chatTools = () => [
  { name:"update_day", description:"Ersetzt die Einheit eines Tages im aktuellen Wochenplan. Nutze das, wenn der Athlet eine Änderung an einem Training wünscht.",
    inputSchema:{type:"object",properties:{date:{type:"string",description:"YYYY-MM-DD"},title:{type:"string"},type:{type:"string",enum:Object.keys(TYPES)},durationMin:{type:"number"},intensity:{type:"string"},notes:{type:"string"},garmin:{type:"string",description:"Bei Ausdauer: Schritte im intervals.icu-Textformat (z.B. '- 10m Z1 HR'), sonst leer"},
      items:{type:"array",items:{type:"object",properties:{name:{type:"string"},kind:{type:"string",enum:["strength","cardio"]},sets:{type:"number"},reps:{type:"string"},load:{type:"string"},target:{type:"string"},notes:{type:"string"}},required:["name","kind"]}}},required:["date","title","type","items"]},
    execute(inp){ if(!S.plan) throw new Error("Kein Plan"); const i=S.plan.days.findIndex(d=>d.date===inp.date); if(i<0) throw new Error("Datum nicht in dieser Woche");
      const np = normalizePlan({days:S.plan.days.map((d,k)=>k===i?inp:d)}, parseD(S.plan.start)); S.plan.days[i]=np.days[i]; save("plan"); return {ok:true}; } },
  { name:"swap_days", description:"Tauscht die Einheiten zweier Tage im aktuellen Wochenplan.",
    inputSchema:{type:"object",properties:{a:{type:"string"},b:{type:"string"}},required:["a","b"]},
    execute({a,b}){ const da=S.plan?.days.find(d=>d.date===a), dbb=S.plan?.days.find(d=>d.date===b); if(!da||!dbb) throw new Error("Datum nicht gefunden");
      const keys=["title","type","durationMin","intensity","notes","items"]; for(const k of keys){ const t=da[k]; da[k]=dbb[k]; dbb[k]=t; } save("plan"); return {ok:true}; } },
  { name:"add_event", description:"Trägt einen Wettkampf in die Saison ein.",
    inputSchema:{type:"object",properties:{name:{type:"string"},date:{type:"string"},type:{type:"string"},goal:{type:"string"},prio:{type:"string",enum:["A","B","C"]}},required:["name","date","type"]},
    execute(e){ S.season.events.push({id:uid(),prio:"A",...e}); save("season"); return {ok:true}; } }
];

async function sendChat(text){
  text = text.trim(); if(!text) return;
  S.chat.push({role:"user",content:text}); save("chat");
  if (!sample){ S.chat.push({role:"sys",content:"Für den Chat-Coach brauchst du einen kostenlosen Google-KI-Schlüssel (oben Uhr-Symbol → Verbindungen)."}); save("chat"); render(); return; }
  busy.chat=true; busy.chatText="…"; render();
  const planTxt = S.plan ? JSON.stringify({start:S.plan.start,phase:S.plan.phase,focus:S.plan.focus,days:S.plan.days.map(d=>({date:d.date,dow:DOWL[(parseD(d.date).getDay()+6)%7],title:d.title,type:d.type,durationMin:d.durationMin,intensity:d.intensity,items:d.items,done:!!S.logs[d.date]?.done}))}) : "kein Plan";
  const system = `Du bist "Coach" in der App TriCoach: ein erfahrener, direkter, motivierender Triathlon-Trainer (Schwimmen, Rad, Laufen, Kraft). Antworte auf Deutsch, locker und knapp (max. ~120 Wörter, keine Markdown-Überschriften). Heute ist ${fmtD(today())} (${today()}).
Wenn der Athlet eine Planänderung möchte, ändere den Plan wirklich mit den Tools (update_day / swap_days) und sag danach kurz, was du geändert hast. Erfinde keine Daten außerhalb der aktuellen Woche. Unter LETZTE TRAININGS siehst du die letzten 4 Wochen des Athleten mit Distanz, Pace, Puls, Sätzen, Gewichten, RPE, Notizen und ausgelassenen Einheiten. Beziehe dich konkret darauf, wenn es passt. Bei Schmerzen/Verletzungen: vorsichtig sein und ggf. Arzt/Physio empfehlen.

ATHLET:
${profileText()}

SAISON:
${seasonText()}

LETZTE TRAININGS:
${recentText()}

AKTUELLER WOCHENPLAN (JSON):
${planTxt}`;
  const hist = S.chat.filter(m=>m.role!=="sys").slice(-12).map(m=>({role:m.role,content:m.content}));
  hist[0] = hist[0].role==="user" ? {role:"user",content:system+"\n\n---\nAthlet: "+hist[0].content} : hist[0];
  if (hist[0].role!=="user") hist.unshift({role:"user",content:system});
  const msgs=[]; for (const m of hist){ if(msgs.length && msgs[msgs.length-1].role===m.role) msgs[msgs.length-1].content+="\n"+m.content; else msgs.push({...m}); }
  if (msgs[0].role==="user" && !msgs[0].content.startsWith(system)) msgs[0].content = system+"\n\n---\nAthlet: "+msgs[0].content;
  try{
    const before = JSON.stringify(S.plan);
    const r = await sample(msgs, { cache:false, tools: chatTools(), onText: ({text}) => { busy.chatText=text; const el=$("#streamTxt"); if(el) el.textContent=text; } });
    S.chat.push({role:"assistant",content:r.text||"…"});
    if (JSON.stringify(S.plan)!==before){ S.chat.push({role:"sys",content:"✓ Plan aktualisiert"+(icuOn()&&S.conn.autoPush?" und an Garmin gesendet":"")}); autoPush(S.plan); }
  }catch(e){
    console.error(e);
    S.chat.push({role:"sys",content: e?.message || "Coach nicht erreichbar."});
  }
  S.chat = S.chat.slice(-60); save("chat");
  busy.chat=false; render();
}

/* ============ Coach-Interview (Erstgespräch vor dem Plan) ============ */
let ivAfter = null;
function ivOn(){ return !!(S.interview.active && sample); }
function needIv(){ return !!sample && !S.interview.done; }
function interviewSystem(turns){
  const stage = turns<6 ? "Du darfst noch NICHT abschließen (done muss false sein)."
    : turns>=12 ? "Du hast genug gefragt: schließe JETZT ab (done true) und liefere die Zusammenfassung."
    : "Schließe ab (done true), sobald du alles Wichtige weißt. Meist reichen 8 bis 11 Antworten.";
  return `Du bist ein professioneller Triathlon- und Ausdauer-Sportcoach mit Trainerlizenz und langjähriger Erfahrung (Mittel- und Langdistanz, Periodisierung, Kraft- und Athletiktraining). Bevor du einen Trainingsplan baust, führst du mit dem Athleten ein Erstgespräch (Anamnese), so wie ein guter Coach es beim ersten Treffen tut.

REGELN FÜRS GESPRÄCH
- Stelle pro Nachricht GENAU EINE Frage. Kurz, freundlich, direkt, Du-Form, Deutsch. Höchstens 3 Sätze, kein Markdown, keine Listen.
- Gehe auf die letzte Antwort mit einem kurzen Satz ein (Einordnung oder Rückfrage), bevor du die nächste Frage stellst. Hake nach, wenn eine Antwort vage ist (zum Beispiel: ungefähr wie viele Kilometer pro Woche?).
- Frage nichts ab, was unten unter BEKANNTE DATEN schon steht. Gehe dort lieber in die Tiefe.
- Themen, die du im Gespräch abdeckst (Reihenfolge nach Gespür):
  1) Wettkampfziel (Wettkampf, Datum, Zielzeit oder Ankommen) und Motivation.
  2) Erfahrung und aktueller Stand in Schwimmen, Rad und Laufen: Umfang pro Woche, typische Leistung (Pace, Watt, Puls), Technik, Schwächen.
  3) Trainingshistorie der letzten 8 bis 12 Wochen und aktuelle Belastbarkeit.
  4) Gesundheit: Verletzungen, Beschwerden, Vorerkrankungen.
  5) Alltag: Beruf, Schichtdienst, Familie, Schlaf, Stress. Daraus: Welche Tage und Zeitfenster sind realistisch, wann gehen lange Einheiten?
  6) Ausstattung und Umgebung: Rennrad oder Rolle, Schwimmbad oder Freiwasser, Uhr, Pulsgurt, Wattmessung, Kraft-Equipment.
  7) Kraft und Mobilität: Erfahrung und Vorlieben.
  8) Vorlieben, Abneigungen und Wünsche an den Coach.
- Du fragst NICHT, an wie vielen Tagen pro Woche der Athlet trainieren will und auch nicht, wie lange eine Einheit dauern soll. Beides legst du später als Coach selbst fest. Frage stattdessen nach Alltag, freien Tagen und Zeitfenstern.

async function ivTurn(){
  const iv = S.interview; if (busy.iv) return;
  busy.iv = true; iv.err = ""; setAiNote(""); render();
  const slowTimer = setTimeout(()=>{ if (busy.iv && !aiNote) setAiNote("Das dauert länger als sonst …"); }, 10000*TS());
  try{
    const turns = iv.msgs.filter(m=>m.role==="user").length;
    const transcript = iv.msgs.map(m=>(m.role==="user"?"ATHLET: ":"COACH: ")+m.content).join("\n");
    const opening = "(noch nichts, du beginnst jetzt: begrüße den Athleten kurz"+(S.profile.name?" mit Vornamen ("+S.profile.name+")":"")+", stelle dich in einem Satz als sein Coach vor, sag in einem Satz, dass du erst ein paar Fragen stellst, bevor du den Plan baust, und stelle die erste Frage)";
    const prompt = interviewSystem(turns) + "\n\nGESPRÄCH BISHER:\n" + (transcript || opening) + "\n\nSchreibe jetzt deine nächste Nachricht als Coach.";
    const r = await aiJSON(prompt, "default", { fast:true, timeoutMs:25000, deadlineMs:60000 });
    clearTimeout(slowTimer);
    const msg = String(r?.message||"").trim();
    const finish = turns>=12 || (r?.done===true && turns>=6);
    if (!finish){
      if (!msg) throw new Error("Der Coach hat nichts geantwortet. Bitte nochmal versuchen.");
      iv.msgs.push({role:"assistant",content:msg}); save("interview");
      busy.iv=false; render();
      const inp=$("#ivIn"); if (inp) inp.focus();
      return;
    }
    const answers = iv.msgs.filter(m=>m.role==="user").map(m=>"– "+m.content).join("\n");
    iv.summary = String(r?.summary||"").trim() || ("Antworten des Athleten im Erstgespräch:\n"+answers);
    if (msg && r?.done===true){ iv.msgs.push({role:"assistant",content:msg}); S.chat.push({role:"assistant",content:msg}); save("chat"); }
    iv.done = true; iv.active = false; save("interview");
    busy.iv=false; render(); toast("Danke! Dein Coach baut jetzt deinen Plan");
    const a = ivAfter || {start:planStart()}; ivAfter = null;
    await doGenerate(a.start, a.extra||"", a.target);
    return;
  }catch(e){ console.error(e); iv.err = e?.message || "Der Coach ist gerade nicht erreichbar."; save("interview"); }
  clearTimeout(slowTimer); setAiNote("");
  busy.iv=false; render();
}

async function coachCheck(date){
  if (!sample || !S.plan || busy.check) return;

  const allowed = S.plan.days.filter(d=>d.date>date && d.date>=today() && !S.logs[d.date]?.done && d.type!=="rest").map(d=>d.date);
  if (!allowed.length) return;
  busy.check = true; render();
  try{
    const prompt = `Du bist ein professioneller Triathlon-Coach. Der Athlet hat soeben eine Einheit abgeschlossen. COACH-CHECK: Prüfe, ob die restlichen Einheiten dieser Woche noch zur tatsächlichen Belastung passen, und schlage nur dann Änderungen vor, wenn sie nötig sind.

Achte auf: tatsächliche Dauer, Pace, Puls und Gewichte gegen den Plan, RPE und Notizen (Müdigkeit, Schmerzen), ausgelassene Einheiten der letzten Wochen, Erholung zwischen harten Einheiten (keine harten Tage direkt hintereinander), Wochenumfang und Saisonphase. Ändere so wenig wie möglich. Bei Schmerzen oder Verletzungshinweisen vorsichtig sein und Arzt oder Physio erwähnen.

${profileText()}

${seasonText()}

Antworte NUR mit JSON in diesem Format: {"adjust":true,"message":"1 bis 3 Sätze an den Athleten: was du siehst und was du vorschlägst","days":[{"date":"YYYY-MM-DD","title":"kurzer Titel","type":"strength|run|bike|swim|brick|hyrox|hybrid|mobility|rest","durationMin":45,"intensity":"leicht|moderat|hart","notes":"Coaching-Hinweis","garmin":"nur bei Ausdauer: Schritte im intervals.icu-Textformat, sonst leerer String","items":[{"name":"Übung","kind":"strength|cardio","sets":3,"reps":"8","load":"RPE 7","target":"","notes":""}]}]}
Wenn nichts geändert werden muss: {"adjust":false,"message":"kurz, warum die Woche so passt","days":[]}. Sprache Deutsch.`;
    const r = await aiJSON(prompt, "default");
    const changes = (r?.adjust===true && Array.isArray(r.days) ? r.days : [])
      .filter(d=>d && allowed.includes(d.date))
      .map(d=>({ ...d, old: S.plan.days.find(x=>x.date===d.date)?.title || "" }));

    save("proposal");

  busy.check = false; render();
}
function applyProposal(){
  const p = S.proposal; if (!p || !S.plan) return;
  let n = 0;
  for (const c of p.changes){
    const i = S.plan.days.findIndex(d=>d.date===c.date); if (i<0 || S.logs[c.date]?.done) continue;
    const { old, ...inp } = c;
    const np = normalizePlan({ days: S.plan.days.map((d,k)=>k===i?inp:d) }, parseD(S.plan.start)); S.plan.days[i] = np.days[i]; n++;
  }
  S.proposal = null; save("proposal"); save("plan");
  if (n) autoPush(S.plan);
  toast(n ? `${n} ${n>1?"Einheiten":"Einheit"} angepasst ✔` : "Nichts zu ändern"); render();
}
