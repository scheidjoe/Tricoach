<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HybridCoach">
<title>HybridCoach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0d0c'/%3E%3Cpath d='M16 18v28M48 18v28M16 32h32' stroke='%23ff5a1f' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d0c; --panel:#151715; --panel2:#1c1f1c; --line:#2a2e2a;
  --text:#f1f3ee; --mute:#9aa197; --dim:#6b7268;
  --accent:#ff5a1f; --accent2:#ffb38f; --ok:#7ee08a; --warn:#ffd166;
  --str:#ff5a1f; --run:#5cc8ff; --bike:#b48cff; --swim:#3ee0c6; --hyrox:#ffd166; --mob:#9aa197; --rest:#3a3f39;
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 92px)}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font:800 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.5px;text-transform:uppercase}
.brand svg{width:30px;height:30px}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.4px;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:22px;margin:22px 0 10px}
h3{font-size:18px}
.mute{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{background:var(--accent);color:#140700;border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
label.f{display:block;margin:12px 0 6px;font-size:13px;color:var(--mute);font-weight:600}
input.i,select.i,textarea.i{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent)}
textarea.i{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:#140700;border-color:var(--accent);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,12,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(var(--safe-b) + 8px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.strip button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.strip button.sel{border-color:var(--accent);background:#21140e}
.strip .d{font-size:11px;color:var(--mute);font-weight:600}
.strip .n{font:700 18px/1 "Barlow Condensed",sans-serif}
.strip .st{width:16px;height:4px;border-radius:2px}
.hero{border-radius:var(--r);padding:18px;margin-bottom:12px;background:linear-gradient(140deg,#1d1410 0%,#151715 60%);border:1px solid #3a2418}
.hero .type{font:700 13px/1 Inter;letter-spacing:1.2px;text-transform:uppercase}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0;padding-top:4px}
.item .nm{font-weight:700}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:3px}
.kv b{color:var(--text);font-weight:600}
.setgrid{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:8px}
.setgrid .h{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase}
.setgrid input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210b}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font:800 30px/1 "Barlow Condensed",sans-serif}
.stat .l{font-size:12px;color:var(--mute);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:#140700;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;font-size:12px;color:var(--mute);background:none;padding:2px}
.composer{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 66px);padding:8px 16px;z-index:9}
.composer .in{max-width:528px;margin:0 auto;display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px}
.composer input{flex:1;background:none;border:0;outline:none;padding:8px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.quick button{white-space:nowrap}
/* misc */
.empty{text-align:center;padding:30px 10px}
.empty svg{width:54px;height:54px;color:var(--accent);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 16px calc(var(--safe-b) + 20px)}
.spinner{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;border-radius:50%;animation:sp .8s linear infinite}
.btn.ghost .spinner{border-color:rgba(255,255,255,.2);border-top-color:var(--text)}
@keyframes sp{to{transform:rotate(360deg)}}
.phasebar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.phasebar div{height:100%}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.bars .bar.cur{background:var(--accent2)}
.bars .lb{font-size:10px;color:var(--dim)}
.bars .vl{font-size:10px;color:var(--mute)}
.rmrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.rmrow:first-child{border-top:0}
.rmrow .v{font:700 22px/1 "Barlow Condensed",sans-serif}
.del{background:none;border:0;color:var(--dim);cursor:pointer;padding:4px}
.review{background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:14px}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.progress div{height:100%;background:var(--ok)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; return addDays(x,-w); };
const today = () => iso(new Date());
const planStart = () => { const n=new Date(); return n.getDay()===0 ? addDays(monday(n),7) : monday(n); };
const DOW = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DOWL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const fmtD = s => { const d=parseD(s); return DOWL[(d.getDay()+6)%7]+", "+d.getDate()+". "+MON[d.getMonth()]; };
const num = v => { const m = String(v ?? "").replace(",",".").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const uid = () => Math.random().toString(36).slice(2,10);
const weeksUntil = s => Math.ceil((parseD(s) - new Date())/(7*864e5));

const TYPES = {
  strength:{l:"Kraft",c:"var(--str)"}, run:{l:"Laufen",c:"var(--run)"}, bike:{l:"Rad",c:"var(--bike)"},
  swim:{l:"Schwimmen",c:"var(--swim)"}, hyrox:{l:"Hyrox",c:"var(--hyrox)"}, hybrid:{l:"Hybrid",c:"var(--hyrox)"},
  mobility:{l:"Mobility",c:"var(--mob)"}, rest:{l:"Ruhetag",c:"var(--rest)"},
  brick:{l:"Koppel Rad+Lauf",c:"var(--bike)"}, triathlon:{l:"Triathlon",c:"var(--swim)"}
};
const T = t => TYPES[t] || TYPES.hybrid;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }

/* ============ state & storage ============ */
const KEYS = ["profile","plan","logs","season","chat","history","imported","conn"];
const DEF = {
  profile:{ onboarded:false, name:"", goals:"", level:"mittel", days:5, minutes:60, sports:["strength","run"], equipment:"Fitnessstudio", limitations:"", lang:"de" },
  plan:null, logs:{}, season:{ events:[] }, chat:[], history:[], imported:[], conn:{ gemKey:"", gemModel:"", icuKey:"", icuId:"0", autoPush:true, lastSync:0 }
};
const S = {}; const LS = "hybridcoach_v1_";
for (const k of KEYS){ let v=null; try{ v = JSON.parse(localStorage.getItem(LS+k)); }catch(e){} S[k] = v ?? structuredClone(DEF[k]); }

let sample=null;
function save(k){ try{ localStorage.setItem(LS+k, JSON.stringify(S[k])); }catch(e){} }
function initCaps(){ sample = S.conn.gemKey ? makeGemini() : null; }

/* ============ Gemini (kostenloser Google-KI-Schlüssel) ============ */
function gemSchema(x){
  if (Array.isArray(x)) return x.map(gemSchema);
  if (x && typeof x==="object"){ const o={}; for (const [k,v] of Object.entries(x)) o[k] = k==="type" && typeof v==="string" ? v.toUpperCase() : gemSchema(v); return o; }
  return x;
}
const sleep = ms => new Promise(res=>setTimeout(res,ms));
async function pickModel(){
  let r; try{ r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers:{ "x-goog-api-key": S.conn.gemKey } }); }catch(e){ throw Object.assign(new Error("Keine Internetverbindung zur Google-KI"),{code:"network"}); }
  if (!r.ok){ let msg=""; try{ msg=(await r.json()).error?.message||""; }catch(e){} throw Object.assign(new Error("Google-KI-Schlüssel ungültig oder gesperrt. "+msg),{code:"bad_key"}); }
  const j = await r.json();
  const ver = n => { const m = n.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const names = (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
  const flash = names.filter(n=>/flash/.test(n) && !/image|tts|audio|live|embed|vision|robot|computer/.test(n));
  // Stabile Modelle zuerst (Preview/Exp sind oft überlastet), dann neueste Version, Lite zuletzt
  const score = n => ver(n)*100 - (/lite/.test(n)?30:0) - (/preview|exp/.test(n)?150:0) - (/\d{2}-\d{2}|\d{3}$/.test(n)?1:0);
  const list = (flash.length?flash:names.filter(n=>/gemini/.test(n))).sort((a,b)=>score(b)-score(a));
  if (!list.length) throw Object.assign(new Error("Kein passendes Google-KI-Modell für diesen Schlüssel gefunden"),{code:"no_model"});
  S.conn.models = list; S.conn.autoModel = list[0]; save("conn"); return list[0];
}
async function gemCall(contents, opts={}, retried){
  const {tools, json} = opts;
  const body = { contents, generationConfig:{ temperature:0.7 } };
  if (json) body.generationConfig.responseMimeType = "application/json";
  if (tools?.length) body.tools = [{ functionDeclarations: tools.map(t=>({ name:t.name, description:t.description, parameters: gemSchema(t.inputSchema) })) }];
  if (!S.conn.autoModel && !S.conn.gemModel) await pickModel();
  // Kandidatenliste: gewähltes Modell zuerst, danach Ausweichmodelle bei Überlastung
  const first = S.conn.gemModel || S.conn.autoModel;
  const candidates = [first, ...(S.conn.models||[]).filter(m=>m!==first)].filter(Boolean).slice(0,4);
  let lastErr;
  for (const model of candidates){
    // Pro Modell bis zu 3 Versuche mit Wartezeit (1.5 s, 3 s) bei 500/503/504
    for (let attempt=0; attempt<3; attempt++){
      let r;
      try{
        r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method:"POST", headers:{ "Content-Type":"application/json", "x-goog-api-key": S.conn.gemKey }, body: JSON.stringify(body) });
      }catch(e){ throw Object.assign(new Error("Keine Internetverbindung zur Google-KI"),{code:"network"}); }
      if (r.ok){
        const j = await r.json();
        const c = j.candidates?.[0];
        if (!c?.content?.parts) throw Object.assign(new Error("Leere Antwort der KI"+(c?.finishReason?" ("+c.finishReason+")":"")),{code:"empty"});
        if (model!==first && !S.conn.gemModel){ S.conn.autoModel = model; save("conn"); }
        return c.content;
      }
      let msg=""; try{ msg=(await r.json()).error?.message||""; }catch(e){}
      if (r.status===429) throw Object.assign(new Error("Gratis-Kontingent der Google-KI gerade aufgebraucht – kurz warten oder morgen wieder."),{code:"rate_limited"});
      if (r.status===400||r.status===401||r.status===403) throw Object.assign(new Error("Google-KI-Schlüssel ungültig oder gesperrt. "+msg),{code:"bad_key"});
      if (r.status===404 || /no longer available|not found|is not supported/i.test(msg)){
        lastErr = Object.assign(new Error("Modell "+model+" nicht verfügbar"),{code:"upstream"});
        break; // nächstes Modell
      }
      lastErr = Object.assign(new Error("Google-KI Fehler "+r.status+" "+msg),{code:"upstream"});
      if ([500,502,503,504].includes(r.status) && attempt<2){ await sleep(1500*(attempt+1)); continue; }
      break; // nächstes Modell
    }
  }
  if (!retried && S.conn.models?.length){ // Modellliste evtl. veraltet → neu laden und einmal erneut versuchen
    S.conn.autoModel=""; S.conn.models=[]; if (!S.conn.gemModel || /nicht verfügbar/.test(lastErr?.message||"")) S.conn.gemModel="";
    save("conn"); await pickModel(); return gemCall(contents, opts, true);
  }
  throw Object.assign(new Error("Die Google-KI ist gerade überlastet (alle Modelle probiert). Dein Schlüssel ist gespeichert – bitte in 1–2 Minuten nochmal versuchen."),{code:"upstream"});
}
function makeGemini(){
  const toContents = input => typeof input==="string" ? [{role:"user",parts:[{text:input}]}] : input.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const fn = async (input, opts={}) => {
    const contents = toContents(input);
    for (let round=0; round<6; round++){
      const content = await gemCall(contents, { tools: opts.tools, json: opts.json });
      const calls = content.parts.filter(p=>p.functionCall);
      if (calls.length && opts.tools){
        contents.push({role:"model", parts: content.parts});
        const resp = [];
        for (const c of calls){
          const t = opts.tools.find(t=>t.name===c.functionCall.name);
          let out; try{ out = { result: await t.execute(c.functionCall.args||{}) }; }catch(e){ out = { error: String(e.message||e) }; }
          resp.push({ functionResponse:{ name:c.functionCall.name, response: out } });
        }
        contents.push({role:"user", parts: resp});
        continue;
      }
      const text = content.parts.filter(p=>p.text && !p.thought).map(p=>p.text).join("").trim();
      opts.onText?.({text, delta:text});
      return { text };
    }
    return { text:"Ich habe den Plan angepasst." };
  };
  fn.json = async (input, opts={}) => { const r = await fn(input, {...opts, json:true}); const t=r.text; return JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}")+1)); };
  return fn;
}

/* ============ AI ============ */
function profileText(){
  const p=S.profile;
  return `Name: ${p.name||"-"}
Ziele: ${p.goals||"-"}
Level: ${p.level}
Trainingstage/Woche: ${p.days}, Zeit pro Einheit: ${p.minutes} min
Sportarten: ${p.sports.map(s=>T(s).l).join(", ")}
Ausstattung: ${p.equipment||"-"}
Einschränkungen/Verletzungen: ${p.limitations||"keine"}`;
}
function seasonText(){
  const ev = S.season.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));
  if (!ev.length) return "Keine Wettkämpfe geplant.";
  return ev.map(e=>`- ${e.name} (${e.type}) am ${e.date}, Priorität ${e.prio||"A"}, in ${weeksUntil(e.date)} Wochen. Aktuelle Phase: ${phaseFor(e).name}`).join("\n");
}
function recentText(){
  const logs = Object.values(S.logs).filter(l=>l.done).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  if (!logs.length) return "Noch keine absolvierten Einheiten.";
  const rms = oneRMs().slice(0,6).map(r=>`${r.name}: ~${r.rm} kg`).join(", ");
  return logs.map(l=>`- ${l.date} ${l.title} (RPE ${l.rpe||"?"})${l.note?": "+l.note:""}`).join("\n") + (rms?`\nGeschätzte 1RM: ${rms}`:"") + `\nKonstanz letzte 4 Wochen: ${consistency(28)}%`;
}
const PLAN_SCHEMA = `{"focus":"Wochenfokus kurz","phase":"z.B. Grundlage/Aufbau/Peak/Tapering","days":[{"date":"YYYY-MM-DD","title":"kurzer Titel","type":"strength|run|bike|swim|brick|hyrox|hybrid|mobility|rest","durationMin":60,"intensity":"leicht|moderat|hart","notes":"Coaching-Hinweis","garmin":"NUR bei Lauf/Rad/Schwimmen/Koppel: Workout-Schritte im intervals.icu-Textformat, sonst leerer String","items":[{"name":"Übung","kind":"strength|cardio","sets":4,"reps":"6","load":"80 kg oder RPE 8","target":"z.B. 5:30 min/km, Zone 2, 8x400m","notes":""}]}]}

Format für "garmin" (nur Herzfrequenz-Zonen Z1-Z5 mit "HR", Zeilen mit "- ", Abschnitte durch Leerzeile getrennt, Wiederholungen als "Main Set 5x"), Beispiel:
"Warmup\n- 10m Z1 HR\n\nMain Set 5x\n- 3m Z4 HR\n- 2m Z1 HR\n\nCooldown\n- 10m Z1 HR"`;

async function aiJSON(prompt, tier){
  if (!sample) throw new Error("KI nicht verfügbar");
  let v;
  if (typeof sample.json === "function"){ v = await sample.json(prompt, { modelTier: tier||"default" }); }

function oneRMs(){
  const best={};
  for (const l of Object.values(S.logs)){ if(!l.done) continue;
    for (const it of l.items||[]){ if(it.kind!=="strength") continue;
      for (const s of it.sets||[]){ const kg=num(s.kg), r=num(s.reps); if(!kg||!r||r>12||!s.done) continue;
        const rm = Math.round(kg*(1+r/30)); const k=it.name.trim();
        if(!best[k]||rm>best[k].rm) best[k]={name:k,rm,kg,reps:r,date:l.date};
      }}}
  return Object.values(best).sort((a,b)=>b.rm-a.rm);
}
function rmHistory(name){
  const pts=[];
  for (const l of Object.values(S.logs)){ if(!l.done) continue;
    for (const it of l.items||[]) if(it.name.trim()===name) { let m=0; for(const s of it.sets||[]){const kg=num(s.kg),r=num(s.reps); if(kg&&r&&r<=12&&s.done) m=Math.max(m,kg*(1+r/30));} if(m) pts.push({date:l.date,rm:Math.round(m)}); } }
  return pts.sort((a,b)=>a.date.localeCompare(b.date));
}
function allPlannedDays(){

}

}

  for (let i=n-1;i>=0;i--){
    const s=addDays(m0,-7*i), e=addDays(s,6); let ton=0, mins=0, cnt=0;

function parseFIT(buf){

      case 4: case 11: { const v=dv.getUint16(off,le); return v===0xFFFF||(bt===11&&v===0)?null:v; }
      case 5: { const v=dv.getInt32(off,le); return v===0x7FFFFFFF?null:v; }
      case 6: case 12: { const v=dv.getUint32(off,le); return v===0xFFFFFFFF||(bt===12&&v===0)?null:v; }

    durationSec: (s[8]??s[7]??0)/1000, distanceM: (s[9]??0)/100, avgHr: s[16]||null, maxHr: s[17]||null, kcal: s[11]||null,
    sets: sets.filter(x=>x[5]===1 || (x[5]==null && x[3])).map(x=>({ cat: FIT_CATS[x[7]] || null, reps: x[3]??null, kg: x[4]!=null ? Math.round(x[4]/16*10)/10 : null })) };
}
function haversine(a,b){ const R=6371000, r=Math.PI/180; const dLa=(b[0]-a[0])*r, dLo=(b[1]-a[1])*r; const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

function parseGPX(txt){

async function unzip(buf){
  const dv=new DataView(buf); let e=buf.byteLength-22;

  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out=[];
  for (let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);

    const raw=buf.slice(ds,ds+csize);
    let data;
    if (method===0) data=raw;
    else if (method===8){
      if (window.DecompressionStream) data = await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
      else if (window.JSZip){ const z=await JSZip.loadAsync(buf); data=await z.file(name).async("arraybuffer"); }
      else throw new Error("ZIP wird von diesem Browser nicht unterstützt – bitte die .fit direkt wählen");
    } else continue;

  }

}
async function parseActivityFile(name, data){

    it.distance = km; it.time = min; it.done = true;
  }
  if (a.sets?.length){
    const used = new Set();
    const groups = {};
    a.sets.forEach(s=>{ const k=s.cat||"other"; (groups[k]=groups[k]||[]).push(s); });
    for (const [cat, ss] of Object.entries(groups)){
      const re = CAT_MATCH[cat];
      let it = re ? log.items.find((i,ix)=>i.kind==="strength" && !used.has(ix) && re.test(i.name)) : null;
      if (!it){ it = {name: CAT_DE[cat] || "Übung", kind:"strength", sets:[]}; log.items.push(it); }
      used.add(log.items.indexOf(it));
      it.sets = ss.map(s=>({reps: s.reps ?? "", kg: s.kg ?? "", done:true}));
    }
  }
  if (log.items.length && log.items.every(i=>i.kind==="strength") && !a.sets?.length && a.kind==="strength"){
    // strength workout without set data: mark planned sets as done
    log.items.forEach(i=>i.sets.forEach(s=>s.done=true));
  }
  log.activities = [...(log.activities||[]), {id:a.id, kind:a.kind, start:a.start, km, durationSec:Math.round(a.durationSec), avgHr:a.avgHr, maxHr:a.maxHr, kcal:a.kcal, pace:fmtPace(a), sets:a.sets?.length||0}];
  const actMin = Math.round(log.activities.reduce((t,x)=>t+x.durationSec,0)/60); if (actMin) log.duration = actMin;
  if (!log.done){ log.done = true; log.finishedAt = Date.now(); }
  log.review = null;
  S.imported.push(a.id); S.imported = S.imported.slice(-500);
  return {status:"ok", date, matched: !!(day && day.type!=="rest"), title: log.title};
}
async function importFiles(files){
  let ok=0, dup=0, err=[], last=null;
  for (const f of files){
    try{
      const acts = await parseActivityFile(f.name, await f.arrayBuffer());
      for (const a of acts){ const r = applyActivity(a); if (r.status==="ok"){ ok++; last=r; } else dup++; }
    }catch(e){ console.error(e); err.push(f.name+": "+e.message); }
  }
  save("logs"); save("imported");
  sheet=null;
  if (last){ selDate = last.date; tab = S.plan?.days.some(d=>d.date===last.date) ? "heute" : "fortschritt"; }
  render();
  toast(ok ? `${ok} Garmin-Aktivität${ok>1?"en":""} importiert${dup?`, ${dup} schon vorhanden`:""} ✔` : err.length ? "Import fehlgeschlagen: "+err[0] : "Schon importiert");
}

/* ============ intervals.icu (Live-Garmin) ============ */
const ICU = "https://intervals.icu/api/v1";
const icuOn = () => !!S.conn.icuKey;
async function icu(path, opts={}){
  let r;
  try{
    r = await fetch(ICU+path.replace("{id}", encodeURIComponent(S.conn.icuId||"0")), { ...opts, headers:{ "Authorization":"Basic "+btoa("API_KEY:"+S.conn.icuKey.trim()), ...(opts.body?{"Content-Type":"application/json"}:{}), ...(opts.headers||{}) } });
  }catch(e){ throw new Error("intervals.icu nicht erreichbar (Internet?)"); }
  if (r.status===401||r.status===403) throw new Error("intervals.icu: API-Schlüssel oder Athleten-ID falsch");
  if (!r.ok) throw new Error("intervals.icu Fehler "+r.status);
  if (opts.raw) return r;
  const t = await r.text(); try{ return t ? JSON.parse(t) : null; }catch(e){ return null; }
}
const ICU_KIND = t => { t=t||""; if(/Run/.test(t)) return "run"; if(/Ride|Cycl/.test(t)) return "bike"; if(/Swim/.test(t)) return "swim"; if(/Weight|Strength/.test(t)) return "strength"; if(/Walk|Hike/.test(t)) return "walk"; if(/Row/.test(t)) return "row"; return "hybrid"; };
const ICU_TYPE = {brick:"Ride",strength:"WeightTraining",run:"Run",bike:"Ride",swim:"Swim",hyrox:"Workout",hybrid:"Workout",mobility:"Yoga"};
async function gunzipMaybe(buf){
  const u = new Uint8Array(buf, 0, 2);
  if (u[0]===0x1f && u[1]===0x8b && window.DecompressionStream) return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return buf;
}
let syncing=false;
async function syncGarmin(manual){
  if (!icuOn() || syncing) return;
  syncing=true; busy.sync=true; if(manual) render();
  let added=[];
  try{
    const oldest = iso(addDays(new Date(), manual? -42 : -21));
    const acts = await icu(`/athlete/{id}/activities?oldest=${oldest}&newest=${today()}`);
    let stravaOnly = 0;
    for (const a of (acts||[]).sort((x,y)=>String(x.start_date_local).localeCompare(String(y.start_date_local)))){
      if (!a.start_date_local || (!a.moving_time && !a.elapsed_time)){ if (a.source==="STRAVA") stravaOnly++; continue; }
      const id = "icu-"+a.id;
      if ((S.imported||[]).includes(id)) continue;
      const act = { id, start: Date.parse(a.start_date_local), kind: ICU_KIND(a.type), durationSec: a.moving_time||a.elapsed_time||0, distanceM: a.distance||0,
        avgHr: a.average_heartrate?Math.round(a.average_heartrate):null, maxHr: a.max_heartrate?Math.round(a.max_heartrate):null, kcal: a.calories||null, sets: [] };
      if (act.kind==="strength"){
        try{ const r = await icu(`/activity/${encodeURIComponent(a.id)}/file`, {raw:true}); const fit = parseFIT(await gunzipMaybe(await r.arrayBuffer())); act.sets = fit.sets||[]; }catch(e){ console.warn("FIT", e); }
      }
      const res = applyActivity(act);
      if (res.status==="ok") added.push({res, act});
    }
    S.conn.lastSync = Date.now(); S.conn.lastError = ""; save("conn");
    if (added.length){ save("logs"); save("imported");
      const l = added[added.length-1];
      toast(added.length===1 ? `Garmin: ${KIND_L[l.act.kind]}${l.act.distanceM?" "+(Math.round(l.act.distanceM/100)/10)+" km":""} übernommen ✔` : `${added.length} neue Garmin-Aktivitäten übernommen ✔`);
    } else if (manual) toast(stravaOnly ? "Achtung: Aktivitäten kommen über Strava – bitte Garmin direkt mit intervals.icu verbinden" : "Alles aktuell ✔");
  }catch(e){ S.conn.lastError = e.message; save("conn"); if (manual) toast(e.message); }
  syncing=false; busy.sync=false; render();
}
function garminDesc(d){
  const lines=[];
  if (d.garmin && ["run","bike","swim","brick"].includes(d.type)) lines.push(d.garmin.trim(), "");
  else if (["run","bike","swim"].includes(d.type) && d.durationMin) lines.push(`- ${d.durationMin}m ${d.intensity==="hart"?"Z3":"Z2"} HR`, "");
  if (d.notes) lines.push(d.notes);
  for (const it of d.items){
    if (it.kind==="strength") lines.push(`${it.name}: ${it.sets}×${it.reps}${it.load?" @ "+it.load:""}${it.notes?" ("+it.notes+")":""}`);
    else if (!d.garmin) lines.push(`${it.name}${it.target?": "+it.target:""}`);
  }
  lines.push("", "Geplant mit HybridCoach");
  return lines.join("\n");
}
async function pushPlan(plan, manual){
  if (!icuOn() || !plan) return;
  busy.push=true; if(manual) render();
  try{
    const events = plan.days.filter(d=>d.type!=="rest").map(d=>({ category:"WORKOUT", start_date_local:d.date+"T00:00:00", type: ICU_TYPE[d.type]||"Workout",
      name: d.title, description: garminDesc(d), moving_time: d.durationMin? d.durationMin*60 : undefined, external_id:"hybridcoach-"+d.date }));
    if (events.length) await icu(`/athlete/{id}/events/bulk?upsert=true`, { method:"POST", body: JSON.stringify(events) });
    // remove old HybridCoach workouts on days that are now rest days
    const end = iso(addDays(parseD(plan.start),6));
    const existing = await icu(`/athlete/{id}/events?oldest=${plan.start}&newest=${end}&category=WORKOUT`);
    const restDates = new Set(plan.days.filter(d=>d.type==="rest").map(d=>d.date));
    for (const ev of existing||[]) if (String(ev.external_id||"").startsWith("hybridcoach-") && restDates.has(String(ev.start_date_local).slice(0,10)))
      await icu(`/athlete/{id}/events/${ev.id}`, { method:"DELETE" });
    plan.pushedAt = Date.now(); save(plan===S.plan?"plan":"nextPlan");
    if (manual) toast("Plan an Garmin gesendet ✔ – Uhr synchronisieren");
  }catch(e){ S.conn.lastError = e.message; save("conn"); toast("Senden an Garmin fehlgeschlagen: "+e.message); }
  busy.push=false; render();
}
const autoPush = plan => { if (icuOn() && S.conn.autoPush) pushPlan(plan); };

    if (it.kind==="strength"){ planned+=it.sets; done+=(li.sets||[]).filter(s=>s.done).length; }
    else { planned+=1; if(li.done||num(li.distance)||num(li.time)) done+=1; } });
  return planned?Math.min(100,Math.round(done/planned*100)):100;
}

/* week */

  <div class="card tight"><div class="row between small"><span class="mute">Fortschritt diese Woche</span><b>${doneN}/${tot}</b></div><div class="progress" style="margin-top:8px"><div style="width:${tot?doneN/tot*100:0}%"></div></div></div>
  ${S.plan.days.map((d,i)=>{ const t=T(d.type); const done=S.logs[d.date]?.done;

/* progress */
function viewProgress(){
  const rms = oneRMs(); const ws = weekStats(8);
  const done = Object.values(S.logs).filter(l=>l.done).length;
  const maxT = Math.max(1,...ws.map(w=>w.ton)); const maxM = Math.max(1,...ws.map(w=>w.mins));
  const hist = Object.values(S.logs).filter(l=>l.done).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  return `<h1 style="margin-bottom:14px">Fortschritt</h1>
  <div class="grid3"><div class="stat"><div class="v">${done}</div><div class="l">Einheiten</div></div><div class="stat"><div class="v">${consistency(28)}<span style="font-size:18px">%</span></div><div class="l">Konstanz 4 Wo.</div></div><div class="stat"><div class="v">${totalKm()}</div><div class="l">km Ausdauer</div></div></div>
  <div class="card"><div class="row between"><h3>Trainingsvolumen Kraft</h3><span class="dim small">kg × Wdh. / Woche</span></div>
    <div class="bars">${ws.map(w=>`<div class="b"><span class="vl">${w.ton?(w.ton>=1000?(w.ton/1000).toFixed(1)+"t":w.ton):""}</span><div class="bar ${w.cur?"cur":""}" style="height:${w.ton/maxT*85}%"></div><span class="lb">${w.label}</span></div>`).join("")}</div></div>
  <div class="card"><div class="row between"><h3>Trainingszeit</h3><span class="dim small">Minuten / Woche</span></div>
    <div class="bars">${ws.map(w=>`<div class="b"><span class="vl">${w.mins||""}</span><div class="bar ${w.cur?"cur":""}" style="height:${w.mins/maxM*85}%;background:${w.cur?"#a8e4ff":"var(--run)"}"></div><span class="lb">${w.label}</span></div>`).join("")}</div></div>
  <div class="card"><h3>Geschätztes 1RM</h3><p class="dim small" style="margin:2px 0 8px">Aus deinen besten Sätzen (Epley-Formel, bis 12 Wdh.)</p>
    ${rms.length?rms.slice(0,10).map(r=>{ const h=rmHistory(r.name); const first=h[0]?.rm; const diff = first&&h.length>1? r.rm-first:0;
      return `<div class="rmrow"><div><div style="font-weight:600">${esc(r.name)}</div><div class="dim small">${r.kg} kg × ${r.reps} am ${parseD(r.date).getDate()}. ${MON[parseD(r.date).getMonth()]}</div></div><div style="text-align:right"><div class="v">${r.rm} kg</div>${diff>0?`<div class="small" style="color:var(--ok)">+${diff} kg</div>`:""}</div></div>`; }).join("")
    :`<p class="mute">Sobald du Kraftsätze abhakst, erscheinen hier deine Werte.</p>`}</div>
  <h2>Verlauf</h2>
  ${hist.length?hist.map(l=>`<div class="card tight" data-openlog="${l.date}" style="cursor:pointer"><div class="row"><span class="dot" style="background:${T(l.type).c}"></span><div class="grow"><div style="font-weight:600">${esc(l.title)}</div><div class="dim small">${esc(fmtD(l.date))}${l.duration?" · "+l.duration+" min":""}${(l.activities||[]).filter(a=>a.km).map(a=>" · "+a.km+" km").join("")}${l.rpe?" · RPE "+l.rpe:""}</div></div>${l.activities?.length?`<span class="tag">${ICON.watch.replace('width="20" height="20"','width="13" height="13"')} Garmin</span>`:""}<div style="display:none"></div></div></div>`).join("")
  :`<div class="card mute">Noch keine Einheiten abgeschlossen.</div>`}`;
}

/* season */
function viewSeason(){
  const ev = [...S.season.events].sort((a,b)=>a.date.localeCompare(b.date));
  const up = ev.filter(e=>e.date>=today()), past = ev.filter(e=>e.date<today());
  const main = up.find(e=>e.prio==="A") || up[0];
  let phaseCard = "";
  if (main){
    const w = weeksUntil(main.date); const tot = Math.max(w,12);
    const seg = [["Grundlage",Math.max(0,w-8),"var(--run)"],["Aufbau",Math.min(5,Math.max(0,w-3)),"var(--warn)"],["Peak",Math.min(2,Math.max(0,w-1)),"var(--accent)"],["Taper",Math.min(1,Math.max(0,w)),"var(--ok)"]];
    const ph = phaseFor(main);
    phaseCard = `<div class="hero"><div class="type" style="color:var(--accent)">Hauptziel</div><h2 style="margin:6px 0 2px;font-size:28px">${esc(main.name)}</h2>
      <div class="mute">${esc(fmtD(main.date))} · ${esc(main.type)}</div>
      <div class="row" style="margin-top:14px;gap:18px"><div><div style="font:800 40px/1 'Barlow Condensed'">${w}</div><div class="dim small">Wochen</div></div><div><div style="font:800 26px/1.2 'Barlow Condensed';color:${ph.c}">${ph.name}</div><div class="dim small">aktuelle Phase</div></div></div>
      <div class="phasebar">${seg.filter(s=>s[1]>0).map(s=>`<div style="flex:${s[1]};background:${s[2]}"></div>`).join("")}</div>
      <div class="row wrap small dim" style="gap:12px">${seg.filter(s=>s[1]>0).map(s=>`<span><span class="dot" style="background:${s[2]}"></span> ${s[0]} ${s[1]} Wo.</span>`).join("")}</div></div>`;
  }
  return `<div class="row between" style="margin-bottom:14px"><h1>Saison</h1><button class="btn sm" data-act="addEvent">+ Wettkampf</button></div>
  ${phaseCard || `<div class="card empty">${ICON.saison}<h2 style="margin-top:4px">Noch kein Ziel</h2><p class="mute">Trag deinen nächsten Hyrox, Lauf oder Triathlon ein. Der Coach richtet die Phasen und Wochenpläne darauf aus.</p><button class="btn" data-act="addEvent">Wettkampf hinzufügen</button></div>`}
  ${up.length?`<h2>Kommende Wettkämpfe</h2>`+up.map(e=>eventRow(e)).join(""):""}
  ${past.length?`<h2>Vergangen</h2>`+past.reverse().map(e=>eventRow(e,true)).join(""):""}
  ${main?`<button class="btn ghost block" style="margin-top:10px" data-act="seasonPlan" ${busy.season?"disabled":""}>${busy.season?'<span class="spinner"></span> Coach plant …':ICON.spark+" Saisonplan vom Coach erklären lassen"}</button>`:""}
  ${S.season.overview?`<div class="card" style="margin-top:12px"><h3>Saisonplan</h3><div class="review" style="margin-top:8px">${esc(S.season.overview)}</div></div>`:""}`;
}

      <div class="row between"><h3>${ICON.spark} KI-Coach</h3><span class="tag" style="${c.gemKey?"color:var(--ok)":""}">${c.gemKey?"Aktiv":"Aus"}</span></div>
      <p class="mute small" style="margin:6px 0 0">Plant deine Wochen, passt sie im Chat an und gibt Feedback. Läuft über einen <b>kostenlosen</b> Google-Gemini-Schlüssel.</p>
      <label class="f">Google-KI-Schlüssel</label>
      <input class="i" id="gemKey" type="password" autocomplete="off" value="${esc(c.gemKey)}" placeholder="AIza…">
      <label class="f">Modell</label>
      <select class="i" id="gemModel">${[["","Automatisch – stabilstes Modell"+(c.autoModel?" ("+c.autoModel+")":"")],...[...new Set([...(c.models||[]),...(c.gemModel?[c.gemModel]:[])])].map(m=>[m,m])].map(([v,l])=>`<option value="${v}" ${c.gemModel===v?"selected":""}>${esc(l)}</option>`).join("")}</select>
      <button class="btn block" style="margin-top:12px" data-act="saveGem" ${busy.gemTest?"disabled":""}>${busy.gemTest?'<span class="spinner"></span> Teste …':"Speichern & testen"}</button>
      <details style="margin-top:14px"><summary class="small" style="cursor:pointer;font-weight:600">Schlüssel holen (1 Minute)</summary>
        <ol class="small" style="padding-left:20px;line-height:1.7;margin:10px 0 0">
          <li><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--accent)">aistudio.google.com/apikey</a> öffnen und mit Google-Konto anmelden.</li>
          <li><b>API-Schlüssel erstellen</b> tippen, kopieren und oben einfügen.</li>
          <li>Keine Zahlungsdaten eingeben – dann bleibt es gratis. Wird das Tageslimit erreicht, einfach später nochmal.</li>
        </ol></details>
    </div>

    <details class="card"><summary style="cursor:pointer;font-weight:700">Ohne intervals.icu: Garmin-Datei importieren</summary>
      <p class="mute small">Auf connect.garmin.com Aktivität öffnen → ⚙ → „Original exportieren“, dann die .zip hier wählen.</p>
      <label class="btn ghost block" style="cursor:pointer">${ICON.upload} Datei auswählen (.fit/.zip/.gpx/.tcx)<input type="file" id="garminFile" accept=".fit,.gpx,.tcx,.zip,application/zip,application/octet-stream" multiple style="display:none"></label>
    </details>
    <p class="dim small">Schlüssel werden nur auf diesem Gerät gespeichert und nur an intervals.icu bzw. Google geschickt.</p>
  </div></div>`;
}

/* ============ actions ============ */
function dayById(date){ return S.plan?.days.find(d=>d.date===date) || allPlannedDays()[date]; }
function newLog(d){
  return { date:d.date, title:d.title, type:d.type, done:false, rpe:null, note:"", duration:d.durationMin||"",
    items: d.items.map(it=> it.kind==="strength"
      ? { name:it.name, kind:"strength", sets: Array.from({length:Math.max(1,+it.sets||3)},()=>({reps: num(it.reps)??"", kg: num(it.load)!==null && /kg/i.test(it.load) ? num(it.load) : "", done:false})) }
      : { name:it.name, kind:"cardio", distance:"", time:"", done:false }) };
}

async function doGenerate(start, extra, target){
  busy.gen = true; render();
  try{
    let plan;
    if (sample){ plan = await generateWeek(start, extra); }
    else { plan = templateWeek(start); toast("Ohne KI-Schlüssel – Standardplan erstellt"); }
    if (target==="next"){ S.nextPlan = plan; save("nextPlan"); toast("Nächste Woche ist geplant"); autoPush(plan); }
    else { S.plan = plan; save("plan"); autoPush(plan); selDate = S.plan.days.some(d=>d.date===today()) ? today() : S.plan.days[0].date; toast("Neue Woche steht 💪"); }
  }catch(e){
    console.error(e);
    if (e?.code==="not_granted"){ sample=null; }
    if (!S.plan && target!=="next"){ S.plan = templateWeek(start); save("plan"); autoPush(S.plan); toast("Standardplan erstellt – "+(e?.message||"KI-Fehler")); }
    else toast("Planung fehlgeschlagen: "+(e?.message||"Fehler"));
  }
  busy.gen=false; render();
}

const chatTools = () => [
  { name:"update_day", description:"Ersetzt die Einheit eines Tages im aktuellen Wochenplan. Nutze das, wenn der Athlet eine Änderung an einem Training wünscht.",
    inputSchema:{type:"object",properties:{date:{type:"string",description:"YYYY-MM-DD"},title:{type:"string"},type:{type:"string",enum:Object.keys(TYPES)},durationMin:{type:"number"},intensity:{type:"string"},notes:{type:"string"},garmin:{type:"string",description:"Bei Ausdauer: Schritte im intervals.icu-Textformat (z.B. '- 10m Z1 HR'), sonst leer"},
      items:{type:"array",items:{type:"object",properties:{name:{type:"string"},kind:{type:"string",enum:["strength","cardio"]},sets:{type:"number"},reps:{type:"string"},load:{type:"string"},target:{type:"string"},notes:{type:"string"}},required:["name","kind"]}}},required:["date","title","type","items"]},
    execute(inp){ if(!S.plan) throw new Error("Kein Plan"); const i=S.plan.days.findIndex(d=>d.date===inp.date); if(i<0) throw new Error("Datum nicht in dieser Woche");
      const np = normalizePlan({days:S.plan.days.map((d,k)=>k===i?inp:d)}, parseD(S.plan.start)); S.plan.days[i]=np.days[i]; save("plan"); return {ok:true}; } },
  { name:"swap_days", description:"Tauscht die Einheiten zweier Tage im aktuellen Wochenplan.",
    inputSchema:{type:"object",properties:{a:{type:"string"},b:{type:"string"}},required:["a","b"]},
    execute({a,b}){ const da=S.plan?.days.find(d=>d.date===a), dbb=S.plan?.days.find(d=>d.date===b); if(!da||!dbb) throw new Error("Datum nicht gefunden");
      const keys=["title","type","durationMin","intensity","notes","items"]; for(const k of keys){ const t=da[k]; da[k]=dbb[k]; dbb[k]=t; } save("plan"); return {ok:true}; } },
  { name:"add_event", description:"Trägt einen Wettkampf in die Saison ein.",
    inputSchema:{type:"object",properties:{name:{type:"string"},date:{type:"string"},type:{type:"string"},goal:{type:"string"},prio:{type:"string",enum:["A","B","C"]}},required:["name","date","type"]},
    execute(e){ S.season.events.push({id:uid(),prio:"A",...e}); save("season"); return {ok:true}; } }
];

async function sendChat(text){
  text = text.trim(); if(!text) return;
  S.chat.push({role:"user",content:text}); save("chat");
  if (!sample){ S.chat.push({role:"sys",content:"Für den Chat-Coach brauchst du einen kostenlosen Google-KI-Schlüssel (oben Uhr-Symbol → Verbindungen)."}); save("chat"); render(); return; }
  busy.chat=true; busy.chatText="…"; render();
  const planTxt = S.plan ? JSON.stringify({start:S.plan.start,phase:S.plan.phase,focus:S.plan.focus,days:S.plan.days.map(d=>({date:d.date,dow:DOWL[(parseD(d.date).getDay()+6)%7],title:d.title,type:d.type,durationMin:d.durationMin,intensity:d.intensity,items:d.items,done:!!S.logs[d.date]?.done}))}) : "kein Plan";
  const system = `Du bist "Coach" in der App HybridCoach: ein erfahrener, direkter, motivierender Hybrid-Trainer (Kraft, Laufen, Rad, Schwimmen, Hyrox). Antworte auf Deutsch, locker und knapp (max. ~120 Wörter, keine Markdown-Überschriften). Heute ist ${fmtD(today())} (${today()}).
Wenn der Athlet eine Planänderung möchte, ändere den Plan wirklich mit den Tools (update_day / swap_days) und sag danach kurz, was du geändert hast. Erfinde keine Daten außerhalb der aktuellen Woche. Bei Schmerzen/Verletzungen: vorsichtig sein und ggf. Arzt/Physio empfehlen.

ATHLET:
${profileText()}

SAISON:
${seasonText()}

LETZTE TRAININGS:
${recentText()}

AKTUELLER WOCHENPLAN (JSON):
${planTxt}`;
  const hist = S.chat.filter(m=>m.role!=="sys").slice(-12).map(m=>({role:m.role,content:m.content}));
  hist[0] = hist[0].role==="user" ? {role:"user",content:system+"\n\n---\nAthlet: "+hist[0].content} : hist[0];
  if (hist[0].role!=="user") hist.unshift({role:"user",content:system});
  const msgs=[]; for (const m of hist){ if(msgs.length && msgs[msgs.length-1].role===m.role) msgs[msgs.length-1].content+="\n"+m.content; else msgs.push({...m}); }
  if (msgs[0].role==="user" && !msgs[0].content.startsWith(system)) msgs[0].content = system+"\n\n---\nAthlet: "+msgs[0].content;
  try{
    const before = JSON.stringify(S.plan);
    const r = await sample(msgs, { cache:false, tools: chatTools(), onText: ({text}) => { busy.chatText=text; const el=$("#streamTxt"); if(el) el.textContent=text; } });
    S.chat.push({role:"assistant",content:r.text||"…"});
    if (JSON.stringify(S.plan)!==before){ S.chat.push({role:"sys",content:"✓ Plan aktualisiert"+(icuOn()&&S.conn.autoPush?" und an Garmin gesendet":"")}); autoPush(S.plan); }
  }catch(e){
    console.error(e);
    S.chat.push({role:"sys",content: e?.message || "Coach nicht erreichbar."});
  }
  S.chat = S.chat.slice(-60); save("chat");
  busy.chat=false; render();
}

async function doReview(date){
  const d=dayById(date), l=S.logs[date]; if(!d||!l) return;
  if (!sample){ toast("Dafür brauchst du den Google-KI-Schlüssel (Uhr-Symbol → Einstellungen)"); return; }
  busy.review=true; render();
  try{
    const r = await sample(`Du bist ein Hybrid-Coach. Vergleiche Plan und tatsächliche Ausführung dieser Einheit. Gib kurzes, konkretes Feedback auf Deutsch (max. 90 Wörter, kein Markdown): 1) Bewertung der Ausführung, 2) was gut war, 3) konkrete Anpassung fürs nächste Mal (Gewicht/Pace).
Athlet: ${profileText()}
PLAN: ${JSON.stringify(d)}
AUSGEFÜHRT: ${JSON.stringify(l)}`, { modelTier:"default" });
    l.review = r.text.trim(); save("logs");
  }catch(e){ toast("Feedback fehlgeschlagen: "+e.message); }
  busy.review=false; render();
}

async function doSeasonPlan(){
  if (!sample){ toast("Dafür brauchst du den Google-KI-Schlüssel (Uhr-Symbol → Einstellungen)"); return; }
  busy.season=true; render();
  try{
    const r = await sample(`Du bist ein Hybrid-Coach. Erstelle einen kompakten Saisonplan auf Deutsch (max. 180 Wörter, kein Markdown, einfache Zeilen mit "–"). Gliedere in Phasen bis zum Hauptwettkampf mit Zeitraum (Kalenderwochen oder Daten), Fokus und wöchentlichen Kernelementen. Heute: ${today()}.
ATHLET: ${profileText()}
WETTKÄMPFE: ${seasonText()}
LETZTE TRAININGS: ${recentText()}`, { modelTier:"complex" });
    S.season.overview = r.text.trim(); save("season");
  }catch(e){ toast("Fehlgeschlagen: "+e.message); }
  busy.season=false; render();
}

/* ============ events ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act],[data-tab],[data-sel],[data-open],[data-openlog],[data-obsport],[data-pfsport],[data-oblevel],[data-setdone],[data-cdone],[data-addset],[data-rmset],[data-rpe],[data-delev],[data-quick],[data-close]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.close && e.target===el){ sheet=null; render(); return; }
  if (ds.tab) return setTab(ds.tab);
  if (ds.sel){ selDate=ds.sel; return render(); }
  if (ds.open){ selDate=ds.open; return setTab("heute"); }
  if (ds.openlog){ const d=ds.openlog; if (S.plan?.days.some(x=>x.date===d)){ selDate=d; return setTab("heute"); } const l=S.logs[d]; toast(`${l.title}: RPE ${l.rpe||"–"}${l.note?" · "+l.note:""}`); return; }
  if (ds.obsport){ toggleSport(ob.sports, ds.obsport); return render(); }
  if (ds.pfsport){ toggleSport(S.profile.sports, ds.pfsport); save("profile"); return render(); }
  if (ds.oblevel){ ob.level=ds.oblevel; return render(); }
  if (ds.setdone){ const [i,j]=ds.setdone.split(".").map(Number); const l=S.logs[selDate]; const s=l.items[i].sets[j]; s.done=!s.done; save("logs"); return render(); }
  if (ds.cdone){ const l=S.logs[selDate]; const it=l.items[+ds.cdone]; it.done=!it.done; save("logs"); return render(); }
  if (ds.addset){ const it=S.logs[selDate].items[+ds.addset]; const last=it.sets[it.sets.length-1]||{}; it.sets.push({reps:last.reps??"",kg:last.kg??"",done:false}); save("logs"); return render(); }
  if (ds.rmset){ S.logs[selDate].items[+ds.rmset].sets.pop(); save("logs"); return render(); }
  if (ds.rpe){ S.logs[selDate].rpe=+ds.rpe; save("logs"); return render(); }
  if (ds.delev){ S.season.events = S.season.events.filter(x=>x.id!==ds.delev); save("season"); return render(); }
  if (ds.quick){ setTab("coach"); return sendChat(ds.quick); }
  const a = ds.act;
  if (a==="finishOnboarding"){
    if (!ob.sports.length) { toast("Wähle mindestens eine Sportart"); return; }
    if (ob.gemKey){ S.conn.gemKey = ob.gemKey.trim(); save("conn"); initCaps(); }
    const {gemKey, ...prof} = ob;
    Object.assign(S.profile, prof, {onboarded:true, days:+ob.days, minutes:+ob.minutes}); save("profile");
    busy.ob=true; render();
    await doGenerate(planStart());
    busy.ob=false; render();
  }
  if (a==="profile"){ sheet=profileSheet; render(); }
  if (a==="garmin"){ sheet=garminSheet; render(); }
  if (a==="syncNow") syncGarmin(true);
  if (a==="pushNow") pushPlan(S.plan, true).then(()=>{ if (S.nextPlan) pushPlan(S.nextPlan); });
  if (a==="saveIcu"){
    S.conn.icuKey = $("#icuKey").value.trim(); S.conn.icuId = $("#icuId").value.trim() || "0"; save("conn");
    if (!S.conn.icuKey){ toast("Garmin-Verbindung entfernt"); render(); return; }
    busy.icuTest=true; render();
    try{ const ath = await icu("/athlete/{id}"); S.conn.lastError=""; save("conn"); toast("Verbunden mit "+(ath?.name||"intervals.icu")+" ✔");
      busy.icuTest=false; await syncGarmin(false); if (S.plan) await pushPlan(S.plan); }
    catch(err){ S.conn.lastError=err.message; save("conn"); toast(err.message); busy.icuTest=false; }
    render();
  }
  if (a==="saveGem"){
    const newKey = $("#gemKey").value.trim(); if (newKey!==S.conn.gemKey){ S.conn.autoModel=""; S.conn.models=[]; } S.conn.gemKey = newKey; S.conn.gemModel = $("#gemModel").value; save("conn"); initCaps();
    if (!sample){ toast("KI-Coach ausgeschaltet"); render(); return; }
    busy.gemTest=true; render();
    try{ await sample("Antworte nur mit: OK"); toast("KI-Coach aktiv ✔ ("+(S.conn.gemModel||S.conn.autoModel)+")"); }catch(err){ toast(err.message); }
    busy.gemTest=false; render();
  }
  if (a==="downloadExport"){ const b=new Blob([JSON.stringify({...S, conn:{...S.conn, gemKey:"", icuKey:""}})],{type:"application/json"}); const u=URL.createObjectURL(b); const el2=document.createElement("a"); el2.href=u; el2.download="hybridcoach-backup-"+today()+".json"; document.body.appendChild(el2); el2.click(); el2.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
  if (a==="closeSheet"){ sheet=null; render(); }
  if (a==="saveProfile"){ document.querySelectorAll("[data-pf]").forEach(i=>{ S.profile[i.dataset.pf] = ["days","minutes"].includes(i.dataset.pf)?+i.value:i.value; }); save("profile"); sheet=null; toast("Gespeichert"); render(); }
  if (a==="copyExport"){ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast("Backup in die Zwischenablage kopiert"); }catch(err){ toast("Kopieren nicht möglich"); } }
  if (a==="reset"){ if (el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Wirklich alles löschen? Nochmal tippen"; return; }
    for (const k of KEYS){ if (k==="conn") continue; S[k]=structuredClone(DEF[k]); save(k); } S.nextPlan=null; save("nextPlan"); ob=null; sheet=null; render(); }
  if (a==="genWeek") doGenerate(planStart());
  if (a==="regenWeek") doGenerate(parseD(S.plan.start), ($("#weekWish")?.value||"").trim());
  if (a==="planNext") doGenerate(addDays(parseD(S.plan.start),7), "", "next");
  if (a==="startLog"){ const d=dayById(ds.date); S.logs[d.date]=newLog(d); save("logs"); render(); window.scrollTo(0,0); }
  if (a==="cancelLog"){ const l=S.logs[ds.date]; if (l?.editing){ delete l.editing; l.done=true; } else delete S.logs[ds.date]; save("logs"); render(); }
  if (a==="editLog"){ const l=S.logs[ds.date]; l.editing=true; l.done=false; save("logs"); render(); }
  if (a==="finishLog"){ const l=S.logs[ds.date]; l.done=true; delete l.editing; l.finishedAt=Date.now(); l.review=null; save("logs"); toast("Stark! Training gespeichert ✔"); render(); window.scrollTo(0,0); }
  if (a==="review") doReview(ds.date);
  if (a==="quickAdjust"){ setTab("coach"); sendChat(ds.q+` (Betrifft das Training am ${fmtD(ds.date)}, ${ds.date}. Bitte direkt anpassen.)`); }
  if (a==="askSwap"){ setTab("coach"); sendChat(`Ich möchte am ${fmtD(ds.date)} (${ds.date}) doch trainieren. Was schlägst du vor? Bitte trag es ein, wenn es Sinn macht.`); }
  if (a==="addEvent"){ sheet=eventSheet; render(); }
  if (a==="saveEvent"){ const name=$("#evName").value.trim(), date=$("#evDate").value; if(!name||!date){ toast("Name und Datum angeben"); return; }
    S.season.events.push({id:uid(),name,date,type:$("#evType").value,goal:$("#evGoal").value.trim(),prio:$("#evPrio").value}); S.season.overview=null; save("season"); sheet=null; toast("Wettkampf eingetragen"); render(); }
  if (a==="seasonPlan") doSeasonPlan();
  if (a==="addExercise"){ sheet=exerciseSheet(ds.date); render(); }
  if (a==="saveExercise"){ const n=$("#exName").value.trim(); if(!n) return; const k=$("#exKind").value; const l=S.logs[ds.date]; const d=dayById(ds.date);
    d.items.push({name:n,kind:k,sets:k==="strength"?3:1,reps:"",load:"",target:"",notes:"hinzugefügt"}); save("plan");
    l.items.push(k==="strength"?{name:n,kind:"strength",sets:[{reps:"",kg:"",done:false},{reps:"",kg:"",done:false},{reps:"",kg:"",done:false}]}:{name:n,kind:"cardio",distance:"",time:"",done:false}); save("logs"); sheet=null; render(); }
});
document.addEventListener("input", e => {
  const t=e.target, ds=t.dataset;
  if (ds.ob){ ob[ds.ob]=t.value; }
  if (ds.lg){ const [i,j,k]=ds.lg.split("."); S.logs[selDate].items[+i].sets[+j][k]=t.value; save("logs"); }
  if (ds.lc){ const [i,k]=ds.lc.split("."); S.logs[selDate].items[+i][k]=t.value; save("logs"); }
  if (ds.lf){ S.logs[selDate][ds.lf]=t.value; save("logs"); }
});
document.addEventListener("change", e => { if (e.target.dataset.ob) ob[e.target.dataset.ob]=e.target.value; if (e.target.id==="garminFile" && e.target.files.length) importFiles([...e.target.files]);
  if (e.target.id==="autoPush"){ S.conn.autoPush=e.target.checked; save("conn"); }
  if (e.target.id==="restoreFile" && e.target.files[0]) e.target.files[0].text().then(t=>{ try{ const d=JSON.parse(t); for (const k of KEYS) if (d[k]!==undefined && k!=="conn"){ S[k]=d[k]; save(k); } if(d.nextPlan){S.nextPlan=d.nextPlan; save("nextPlan");} sheet=null; toast("Backup wiederhergestellt ✔"); render(); }catch(err){ toast("Ungültige Backup-Datei"); } });
});
document.addEventListener("submit", e => { if (e.target.id==="chatForm"){ e.preventDefault(); const i=$("#chatIn"); const v=i.value; i.value=""; sendChat(v); } });

/* next-week rollover */
try{ S.nextPlan = JSON.parse(localStorage.getItem(LS+"nextPlan")); }catch(e){ S.nextPlan=null; }
KEYS.push("nextPlan"); DEF.nextPlan=null;
(function rollover(){
  const cur = iso(monday(new Date()));
  if (S.nextPlan && S.nextPlan.start===cur && (!S.plan || S.plan.start<cur)){
    if (S.plan) { S.history.push(S.plan); save("history"); }
    S.plan=S.nextPlan; S.nextPlan=null; save("plan"); save("nextPlan");
  }
})();

initCaps();
render();
if (icuOn()){ syncGarmin(false); if (S.plan && !S.plan.pushedAt && S.conn.autoPush) pushPlan(S.plan); }
setInterval(()=>{ if (document.visibilityState==="visible" && icuOn()) syncGarmin(false); }, 3*60*1000);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && icuOn() && Date.now()-S.conn.lastSync>60000) syncGarmin(false); });
/* installierbar machen */
try{
  const icon = c => { const cv=document.createElement("canvas"); cv.width=cv.height=c; const x=cv.getContext("2d"); x.fillStyle="#0c0d0c"; x.fillRect(0,0,c,c); x.strokeStyle="#ff5a1f"; x.lineWidth=c*.11; x.lineCap="round"; x.beginPath(); x.moveTo(c*.25,c*.28); x.lineTo(c*.25,c*.72); x.moveTo(c*.75,c*.28); x.lineTo(c*.75,c*.72); x.moveTo(c*.25,c*.5); x.lineTo(c*.75,c*.5); x.stroke(); return cv.toDataURL("image/png"); };
  const base = location.href.split("#")[0];
  const man = { name:"HybridCoach", short_name:"HybridCoach", start_url: base, scope: base.replace(/[^/]*$/,""), display:"standalone", background_color:"#0c0d0c", theme_color:"#0c0d0c",
    icons:[{src:icon(192),sizes:"192x192",type:"image/png"},{src:icon(512),sizes:"512x512",type:"image/png",purpose:"any maskable"}] };
  const l=document.createElement("link"); l.rel="manifest"; l.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
  const t=document.createElement("link"); t.rel="apple-touch-icon"; t.href=icon(180); document.head.appendChild(t);
}catch(e){}
</script>
